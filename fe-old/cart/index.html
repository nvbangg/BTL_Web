<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Giỏ hàng - Fashon Shop</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="cart.css">
</head>
<body>
  <div id="header"></div>

  <main class="page-body">
    <div class="container">
      <h2 class="cart-title">Giỏ hàng của bạn</h2>

      <div class="cart-layout" id="cart-layout" style="display:none">
        <div class="cart-items">
          <div class="cart-select-all" id="cart-select-all-row">
            <label class="checkbox-wrap cart-check-wrap">
              <input type="checkbox" id="select-all" checked>
              <span id="select-all-label">Chọn tất cả (0 sản phẩm)</span>
            </label>
          </div>
          <div id="cart-list"></div>
        </div>
        <aside class="cart-summary" id="cart-summary">
          <div class="inline-order-panel" id="inline-order-panel" style="display:none">
            <h3>Chi tiết đơn hàng</h3>
            <form id="order-form">
              <div class="form-group">
                <label>Tên người nhận</label>
                <input class="form-input" name="recipientName" required placeholder="Nhập tên người nhận...">
              </div>
              <div class="form-group">
                <label>Số điện thoại liên hệ</label>
                <input class="form-input" name="phone" required placeholder="Nhập số điện thoại...">
              </div>
              <div class="form-group">
                <label>Địa chỉ nhận</label>
                <input class="form-input" name="address" required placeholder="Nhập địa chỉ nhận hàng...">
              </div>
              <div class="order-save-default">
                <label class="checkbox-wrap">
                  <input type="checkbox" name="saveDefault" checked>
                  <span>Lưu làm mặc định</span>
                </label>
              </div>
              <div class="order-form-divider"></div>
            </form>
          </div>

          <div class="cart-summary-total-row">
            <h3>Tổng tiền</h3>
            <div class="cart-summary-price" id="cart-summary-price">0đ</div>
          </div>
          <button class="btn-checkout" id="btn-place-order">
            <span class="btn-checkout-label">Đặt hàng</span>
            <svg class="btn-checkout-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="5" y1="12" x2="19" y2="12"></line>
              <polyline points="12 5 19 12 12 19"></polyline>
            </svg>
          </button>
        </aside>
      </div>

      <div class="empty-state" id="cart-empty" style="display:none">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 002 1.61h9.72a2 2 0 002-1.61L23 6H6"/></svg>
        <h3>Giỏ hàng trống</h3>
        <p>Hãy thêm sản phẩm vào giỏ hàng</p>
        <a href="../" class="btn btn-primary">Mua sắm ngay</a>
      </div>
    </div>
  </main>

  <div id="footer"></div>
  <div id="auth"></div>

  <script src="../js/utils.js"></script>
  <script src="../mock/api-responses.js"></script>
  <script src="../js/components.js"></script>
  <script src="../js/auth.js"></script>
  <script src="cart.js"></script>
</body>
</html>
