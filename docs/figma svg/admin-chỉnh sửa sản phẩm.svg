    <text x="360" y="110" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#0F172A">Chỉnh sửa sản phẩm</text>
    <g id="Close_Button" style="cursor: pointer;">
      <circle cx="1060" cy="100" r="16" fill="#F1F5F9" />
      <path d="M1054 94 L1066 106 M1066 94 L1054 106" stroke="#64748B" stroke-width="2" stroke-linecap="round" />
    </g>
    <line x1="320" y1="135" x2="1120" y2="135" stroke="#E2E8F0" stroke-width="1.5" />

    <text x="360" y="165" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#475569">Tên sản phẩm *</text>
    <rect x="360" y="175" width="720" height="42" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" />
    <text x="375" y="202" font-family="Arial, sans-serif" font-size="15" fill="#0F172A">Áo Sơ-mi Ngắn Tay Asymmetrical</text>

    <text x="360" y="245" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#475569">Danh mục *</text>
    <g style="cursor: text;">
      <rect x="360" y="255" width="340" height="42" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" />
      <text x="375" y="282" font-family="Arial, sans-serif" font-size="15" fill="#0F172A">Áo sơ mi</text>
      <line x1="445" y1="266" x2="445" y2="284" stroke="#0F172A" stroke-width="1.5" />
    </g>

    <text x="740" y="245" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#475569">Giới tính</text>
    <g style="cursor: pointer;">
      <rect x="740" y="255" width="340" height="42" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" />
      <text x="755" y="282" font-family="Arial, sans-serif" font-size="15" fill="#0F172A">Nam</text>
      <path d="M1050 270 L1056 276 L1062 270" stroke="#64748B" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <text x="360" y="325" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#475569">Giá bán cơ bản (VNĐ) *</text>
    <rect x="360" y="335" width="340" height="42" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" />
    <text x="375" y="362" font-family="Arial, sans-serif" font-size="15" fill="#0F172A">399000</text>

    <text x="740" y="325" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#475569">Trạng thái hiển thị</text>
    <g style="cursor: pointer;" transform="translate(740, 345)">
      <rect x="0" y="0" width="44" height="24" rx="12" fill="#10B981" />
      <circle cx="32" cy="12" r="10" fill="#FFFFFF" />
      <text x="55" y="16" font-family="Arial, sans-serif" font-size="14" fill="#0F172A">Đang bật</text>
    </g>

    <text x="360" y="415" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#475569">Mô tả sản phẩm</text>
    <rect x="360" y="425" width="720" height="80" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" />
    <text x="375" y="445" font-family="Arial, sans-serif" font-size="15" fill="#0F172A">Áo sơ mi form rộng thoải mái, thiết kế vạt áo bất đối xứng độc đáo.</text>
    <text x="375" y="465" font-family="Arial, sans-serif" font-size="15" fill="#0F172A">Chất liệu vải cotton cao cấp thoáng mát, thấm hút mồ hôi tốt.</text>

    <text x="360" y="535" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#475569">Hình ảnh (Ảnh đầu tiên sẽ là Thumbnail)</text>
    
    <g id="Thumbnail_Image">
      <rect x="360" y="545" width="80" height="80" rx="8" fill="#FCE7F3" stroke="#2563EB" stroke-width="2" />
      <text x="400" y="590" font-family="Arial, sans-serif" font-size="12" fill="#0F172A" text-anchor="middle">Img 1</text>
      <polygon points="360,545 385,545 360,570" fill="#2563EB" />
      <path d="M365 553 L367 550 L370 550 L368 548 L369 545 L366 546 L363 545 L364 548 L362 550 L365 550 Z" fill="#FFFFFF" />
    </g>

    <g id="Extra_Image">
