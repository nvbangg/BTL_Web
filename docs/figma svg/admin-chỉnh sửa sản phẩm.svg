<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1024" width="1440" height="1024">
  <defs>
    <filter id="shadow-sm" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.05"/>
    </filter>
    <filter id="shadow-md" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
    <filter id="popupShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="1440" height="1024" fill="#F1F5F9" />

  <rect x="0" y="0" width="280" height="1024" fill="#FFFFFF" filter="url(#shadow-md)" />
  
  <g id="Logo_Header" style="cursor: pointer;" transform="translate(14, 0)">
    <circle cx="50" cy="50" r="16" fill="#2563EB" />
    <circle cx="66" cy="50" r="16" fill="#60A5FA" opacity="0.8" />
    <text x="95" y="58" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="#0F172A">Fashon Shop</text>
  </g>

  <g id="Sidebar_Menu" transform="translate(0, 130)">
    <g id="Nav_Dashboard" style="cursor: pointer;">
      <rect x="16" y="0" width="248" height="52" rx="12" fill="transparent" />
      <path d="M45 35 V17 M55 35 V25 M65 35 V13" stroke="#475569" stroke-width="2.5" stroke-linecap="round" fill="none"/>
      <path d="M35 38 H75" stroke="#475569" stroke-width="2.5" stroke-linecap="round" fill="none"/>
      <text x="90" y="32" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#475569">Xem thống kê</text>
    </g>

    <g id="Nav_Orders" transform="translate(0, 60)" style="cursor: pointer;">
      <rect x="16" y="0" width="248" height="52" rx="12" fill="transparent" />
      <path d="M40 20 L55 13 L70 20 V32 L55 39 L40 32 Z" stroke="#475569" stroke-width="2" fill="none" stroke-linejoin="round"/>
      <path d="M40 20 L55 27 L70 20 M55 27 V39" stroke="#475569" stroke-width="2" fill="none" stroke-linejoin="round"/>
      <text x="90" y="32" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#475569">Quản lý đơn hàng</text>
      <rect x="230" y="16" width="24" height="20" rx="10" fill="#EF4444" />
      <text x="242" y="31" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">12</text>
    </g>

    <g id="Nav_Products" transform="translate(0, 120)" style="cursor: pointer;">
      <rect x="16" y="0" width="248" height="52" rx="12" fill="#EFF6FF" />
      <rect x="16" y="10" width="4" height="32" rx="2" fill="#2563EB" />
      <path d="M45 15 L55 20 L65 15 L70 25 L65 30 V38 H45 V30 L40 25 Z" stroke="#2563EB" stroke-width="2" fill="none" stroke-linejoin="round"/>
      <text x="90" y="32" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2563EB">Quản lý sản phẩm</text>
    </g>

    <g id="Nav_Users" transform="translate(0, 180)" style="cursor: pointer;">
      <rect x="16" y="0" width="248" height="52" rx="12" fill="transparent" />
      <circle cx="55" cy="20" r="6" stroke="#64748B" stroke-width="2" fill="none"/>
      <path d="M43 36 C43 30 67 30 67 36" stroke="#64748B" stroke-width="2" fill="none" stroke-linecap="round"/>
      <text x="90" y="32" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#475569">Quản lý người dùng</text>
    </g>
  </g>

  <g id="User_Dropup_Menu">
    <rect x="16" y="750" width="248" height="155" rx="12" fill="#FFFFFF" filter="url(#shadow-md)" stroke="#E2E8F0" stroke-width="1" />
    
    <g id="Menu_Item_User_Page" style="cursor: pointer;">
      <rect x="26" y="760" width="228" height="40" rx="8" fill="#F8FAFC" />
      <path d="M55 780 H35 M35 780 L42 773 M35 780 L42 787" stroke="#0F172A" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="66" y="785" font-family="Arial, sans-serif" font-size="16" fill="#0F172A">Trang người dùng</text>
    </g>
    
    <g id="Menu_Item_Change_Password" style="cursor: pointer;">
      <rect x="26" y="800" width="228" height="40" rx="8" fill="none" />
      <path d="M41 815 V812 A 4 4 0 0 1 49 812 V815" stroke="#475569" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="39" y="815" width="12" height="10" rx="2" stroke="#475569" stroke-width="1.5" fill="none"/>
      <circle cx="45" cy="820" r="1.5" fill="#475569" />
      <text x="66" y="825" font-family="Arial, sans-serif" font-size="16" fill="#475569">Đổi mật khẩu</text>
    </g>

    <path d="M16 845 L264 845" stroke="#E2E8F0" stroke-width="1" />
    
    <g id="Menu_Item_Logout" style="cursor: pointer;">
      <rect x="26" y="850" width="228" height="40" rx="8" fill="none" />
      <path d="M47 863 H41 V877 H47 M50 866 L54 870 L50 874 M44 870 H54" stroke="#EF4444" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="66" y="875" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#EF4444">Đăng xuất</text>
    </g>
  </g>

  <g id="Sidebar_Footer" transform="translate(0, 920)">
    <line x1="16" y1="0" x2="264" y2="0" stroke="#E2E8F0" stroke-width="1" />
    <g id="User_Profile" style="cursor: pointer;" transform="translate(16, 20)">
      <circle cx="30" cy="30" r="18" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5" />
      <circle cx="30" cy="25" r="6" stroke="#94A3B8" stroke-width="1.5" fill="none" />
      <path d="M18 38 C18 31 42 31 42 38" stroke="#94A3B8" stroke-width="1.5" fill="none" />
      <text x="60" y="36" font-family="Arial, sans-serif" font-size="18" font-weight="600" fill="#0F172A">nvbangg</text>
      <path d="M220 34 L227 27 L234 34" stroke="#0F172A" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    </g>
  </g>

  <g id="Top_Header" transform="translate(280, 0)">
    <rect width="1160" height="80" fill="#FFFFFF" filter="url(#shadow-sm)" />
    <text x="40" y="48" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#0F172A">Quản lý sản phẩm</text>
  </g>

  <g id="Dashboard_Content" transform="translate(320, 110)">
    <g id="Card_Total_Products">
      <rect x="0" y="0" width="340" height="130" rx="16" fill="#FFFFFF" filter="url(#shadow-md)" />
      <rect x="20" y="20" width="48" height="48" rx="12" fill="#F1F5F9" />
      <path d="M36 34 L44 38 L52 34 L56 42 L52 46 V52 H36 V46 L32 42 Z" stroke="#64748B" stroke-width="2" fill="none" stroke-linejoin="round" transform="translate(0, -5)"/>
      <text x="85" y="40" font-family="Arial, sans-serif" font-size="16" fill="#64748B">Tổng số sản phẩm</text>
      <text x="20" y="95" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#0F172A">156</text>
    </g>

    <g id="Card_Active" transform="translate(370, 0)">
      <rect x="0" y="0" width="340" height="130" rx="16" fill="#FFFFFF" filter="url(#shadow-md)" />
      <rect x="20" y="20" width="48" height="48" rx="12" fill="#DCFCE7" />
      <circle cx="44" cy="44" r="14" fill="none" stroke="#16A34A" stroke-width="2" transform="translate(0, -10)"/>
      <path d="M38 44 L42 48 L50 38" stroke="#16A34A" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" transform="translate(0, -10)"/>
      <text x="85" y="40" font-family="Arial, sans-serif" font-size="16" fill="#64748B">Sản phẩm đang kinh doanh</text>
      <text x="20" y="95" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#0F172A">142</text>
    </g>

    <g id="Card_Out_Of_Stock" transform="translate(740, 0)">
      <rect x="0" y="0" width="340" height="130" rx="16" fill="#FFFFFF" filter="url(#shadow-md)" />
      <rect x="20" y="20" width="48" height="48" rx="12" fill="#FEE2E2" />
      <circle cx="44" cy="44" r="14" fill="none" stroke="#EF4444" stroke-width="2" transform="translate(0, -10)"/>
      <path d="M44 38 V45 M44 50 V50.1" stroke="#EF4444" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" transform="translate(0, -10)"/>
      <text x="85" y="40" font-family="Arial, sans-serif" font-size="16" fill="#64748B">Sản phẩm hết hàng</text>
      <text x="20" y="95" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#EF4444">14</text>
    </g>

    <g id="Products_Table_Section" transform="translate(0, 160)">
      <rect x="0" y="0" width="1080" height="670" rx="16" fill="#FFFFFF" filter="url(#shadow-md)" />
      <text x="30" y="38" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#0F172A">Danh sách sản phẩm</text>
      
      <g id="Search_Bar" transform="translate(240, 14)">
        <rect x="0" y="0" width="630" height="38" rx="19" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" />
        <circle cx="20" cy="19" r="6" stroke="#64748B" stroke-width="2" fill="none" />
        <path d="M25 24 L31 30" stroke="#64748B" stroke-width="2" stroke-linecap="round" />
        <text x="40" y="24" font-family="Arial, sans-serif" font-size="14" fill="#94A3B8">Tìm kiếm sản phẩm...</text>
      </g>

      <g style="cursor: pointer;" transform="translate(900, 14)">
        <rect x="0" y="0" width="150" height="38" rx="8" fill="#2563EB" />
        <path d="M25 19 H37 M31 13 V25" stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linecap="round"/>
        <text x="45" y="24" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF">Thêm sản phẩm</text>
      </g>

      <rect x="30" y="140" width="1020" height="44" rx="8" fill="#F8FAFC" />
      <text x="50" y="167" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#64748B">Sản phẩm</text>
      <text x="420" y="167" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#64748B">Danh mục</text>
      <text x="580" y="167" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#64748B">Giá bán</text>
      <text x="720" y="167" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#64748B">Tồn kho</text>
      <text x="840" y="167" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#64748B">Trạng thái</text>
      <text x="960" y="167" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#64748B">Thao tác</text>
    </g>
  </g>

  <rect width="1440" height="1024" fill="#0F172A" opacity="0.6" />

  <g id="Popup_Edit_Product">
