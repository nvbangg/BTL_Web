      <text x="495" y="590" font-family="Arial, sans-serif" font-size="12" fill="#0F172A" text-anchor="middle">Img 2</text>
    </g>

    <g id="Add_Image_Btn" style="cursor: pointer;">
      <rect x="550" y="545" width="80" height="80" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="4 4" />
      <path d="M590 575 V595 M580 585 H600" stroke="#94A3B8" stroke-width="2" fill="none" stroke-linecap="round" />
    </g>

    <text x="360" y="655" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#475569">Phân loại sản phẩm</text>
    
    <rect x="360" y="665" width="720" height="150" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
    
    <rect x="360" y="665" width="720" height="36" fill="#F8FAFC" />
    <line x1="360" y1="701" x2="1080" y2="701" stroke="#E2E8F0" stroke-width="1" />
    
    <text x="380" y="688" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#64748B">Màu sắc</text>
    <text x="540" y="688" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#64748B">Size</text>
    <text x="700" y="688" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#64748B">Tồn kho</text>
    <text x="860" y="688" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#64748B">Giá tùy chỉnh</text>

    <g transform="translate(0, 715)">
      <rect x="380" y="0" width="140" height="32" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" />
      <text x="395" y="20" font-family="Arial, sans-serif" font-size="13" fill="#0F172A">Đen</text>

      <rect x="540" y="0" width="140" height="32" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" />
      <text x="555" y="20" font-family="Arial, sans-serif" font-size="13" fill="#0F172A">M</text>

      <rect x="700" y="0" width="140" height="32" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" />
      <text x="715" y="20" font-family="Arial, sans-serif" font-size="13" fill="#0F172A">100</text>

      <rect x="860" y="0" width="200" height="32" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" />
      <text x="875" y="20" font-family="Arial, sans-serif" font-size="13" fill="#94A3B8">(Để trống lấy giá cơ bản)</text>
    </g>

    <g transform="translate(0, 760)">
      <rect x="380" y="0" width="140" height="32" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" />
      <text x="395" y="20" font-family="Arial, sans-serif" font-size="13" fill="#0F172A">Đen</text>

      <rect x="540" y="0" width="140" height="32" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" />
      <text x="555" y="20" font-family="Arial, sans-serif" font-size="13" fill="#0F172A">L</text>

      <rect x="700" y="0" width="140" height="32" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" />
      <text x="715" y="20" font-family="Arial, sans-serif" font-size="13" fill="#0F172A">50</text>

      <rect x="860" y="0" width="200" height="32" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" />
      <text x="875" y="20" font-family="Arial, sans-serif" font-size="13" fill="#94A3B8">(Để trống lấy giá cơ bản)</text>
    </g>

    <text x="380" y="835" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2563EB" style="cursor: pointer;">+ Thêm phân loại</text>

    <line x1="320" y1="870" x2="1120" y2="870" stroke="#E2E8F0" stroke-width="1.5" />

    <g id="Button_Cancel" style="cursor: pointer;">
      <rect x="820" y="885" width="110" height="44" rx="8" fill="#F1F5F9" />
      <text x="875" y="912" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#475569" text-anchor="middle">Hủy</text>
    </g>

    <g id="Button_Save" style="cursor: pointer;">
      <rect x="940" y="885" width="140" height="44" rx="8" fill="#2563EB" />
      <text x="1010" y="912" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Lưu thay đổi</text>
    </g>

  </g>
</svg>
