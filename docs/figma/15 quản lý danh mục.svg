<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1024" width="1440" height="1024">
  <defs>
    <filter id="shadow-sm" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.05"/>
    </filter>
    <filter id="shadow-md" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
    <filter id="popupShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="1440" height="1024" fill="#F1F5F9" />

  <rect x="0" y="0" width="280" height="1024" fill="#FFFFFF" filter="url(#shadow-md)" />
  
  <g id="Logo_Header" style="cursor: pointer;">
    <circle cx="45" cy="50" r="16" fill="#2563EB" />
    <circle cx="61" cy="50" r="16" fill="#60A5FA" opacity="0.8" />
    <text x="90" y="58" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="#0F172A">Fashon Shop</text>
  </g>

  <g id="Sidebar_Menu" transform="translate(0, 130)">
    <g id="Nav_Dashboard" style="cursor: pointer;">
      <rect x="16" y="0" width="248" height="52" rx="12" fill="transparent" />
      <path d="M45 35 V17 M55 35 V25 M65 35 V13" stroke="#475569" stroke-width="2.5" stroke-linecap="round" fill="none"/>
      <path d="M35 38 H75" stroke="#475569" stroke-width="2.5" stroke-linecap="round" fill="none"/>
      <text x="90" y="32" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#475569">Xem thống kê</text>
    </g>

    <g id="Nav_Orders" transform="translate(0, 60)" style="cursor: pointer;">
      <rect x="16" y="0" width="248" height="52" rx="12" fill="transparent" />
      <path d="M40 20 L55 13 L70 20 V32 L55 39 L40 32 Z" stroke="#475569" stroke-width="2" fill="none" stroke-linejoin="round"/>
      <path d="M40 20 L55 27 L70 20 M55 27 V39" stroke="#475569" stroke-width="2" fill="none" stroke-linejoin="round"/>
      <text x="90" y="32" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#475569">Quản lý đơn hàng</text>
      <rect x="230" y="16" width="24" height="20" rx="10" fill="#EF4444" />
      <text x="242" y="31" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">12</text>
    </g>

    <g id="Nav_Products" transform="translate(0, 120)" style="cursor: pointer;">
      <rect x="16" y="0" width="248" height="52" rx="12" fill="transparent" />
      <path d="M45 15 L55 20 L65 15 L70 25 L65 30 V38 H45 V30 L40 25 Z" stroke="#475569" stroke-width="2" fill="none" stroke-linejoin="round"/>
      <text x="90" y="32" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#475569">Quản lý sản phẩm</text>
    </g>

    <g id="Nav_Categories" transform="translate(0, 180)" style="cursor: pointer;">
      <rect x="16" y="0" width="248" height="52" rx="12" fill="#EFF6FF" />
      <rect x="16" y="10" width="4" height="32" rx="2" fill="#2563EB" />
      <path d="M45 18 H55 L68 31 C70 33 70 36 68 38 L65 41 C63 43 60 43 58 41 L45 28 V18 Z" stroke="#2563EB" stroke-width="2" fill="none" stroke-linejoin="round"/>
      <circle cx="51" cy="24" r="2" fill="#2563EB" />
      <text x="90" y="32" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2563EB">Quản lý danh mục</text>
    </g>
  </g>

  <g id="Sidebar_Footer" transform="translate(0, 920)">
    <line x1="16" y1="0" x2="264" y2="0" stroke="#E2E8F0" stroke-width="1" />
    <g style="cursor: pointer;" transform="translate(16, 30)">
      <rect x="0" y="0" width="248" height="52" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" />
      <path d="M35 26 H15 M15 26 L22 19 M15 26 L22 33" stroke="#475569" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="55" y="32" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#475569">Về trang người dùng</text>
    </g>
  </g>

  <g id="Top_Header" transform="translate(280, 0)">
    <rect width="1160" height="80" fill="#FFFFFF" filter="url(#shadow-sm)" />
    <text x="40" y="48" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#0F172A">Quản lý danh mục</text>
  </g>

  <g id="Dashboard_Content" transform="translate(320, 110)">
    
    <g id="Card_Total_Categories">
      <rect x="0" y="0" width="520" height="130" rx="16" fill="#FFFFFF" filter="url(#shadow-md)" />
      
      <rect x="40" y="35" width="60" height="60" rx="16" fill="#DBEAFE" />
      <path d="M60 55 H70 L80 65 C82 67 82 70 80 72 L76 76 C74 78 71 78 69 76 L60 67 V55 Z" stroke="#2563EB" stroke-width="2.5" fill="none" stroke-linejoin="round" />
      <circle cx="66" cy="61" r="2.5" fill="#2563EB" />
      
      <text x="130" y="65" font-family="Arial, sans-serif" font-size="18" fill="#64748B">Số lượng danh mục</text>
      <text x="130" y="105" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#0F172A">8</text>
    </g>

    <g id="Card_Empty_Categories" transform="translate(560, 0)">
      <rect x="0" y="0" width="520" height="130" rx="16" fill="#FFFFFF" filter="url(#shadow-md)" />
      
      <rect x="40" y="35" width="60" height="60" rx="16" fill="#FEF3C7" />
      <path d="M52 60 L70 50 L88 60 V76 L70 86 L52 76 Z" stroke="#D97706" stroke-width="2.5" fill="none" stroke-linejoin="round" />
      <path d="M52 60 L70 70 L88 60 M70 70 V86" stroke="#D97706" stroke-width="2.5" fill="none" stroke-linejoin="round" />
      
      <text x="130" y="65" font-family="Arial, sans-serif" font-size="18" fill="#64748B">Số danh mục trống</text>
      <text x="130" y="105" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#0F172A">2</text>
    </g>

    <g id="Categories_Table_Section" transform="translate(0, 160)">
      <rect x="0" y="0" width="1080" height="600" rx="16" fill="#FFFFFF" filter="url(#shadow-md)" />
      
      <text x="30" y="38" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#0F172A">Danh sách danh mục</text>
      
      <g id="Search_Bar" transform="translate(260, 14)">
        <rect x="0" y="0" width="600" height="38" rx="19" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" />
        <circle cx="20" cy="19" r="6" stroke="#64748B" stroke-width="2" fill="none" />
        <path d="M25 24 L31 30" stroke="#64748B" stroke-width="2" stroke-linecap="round" />
        <text x="40" y="24" font-family="Arial, sans-serif" font-size="14" fill="#94A3B8">Tìm kiếm danh mục...</text>
      </g>

      <g style="cursor: pointer;" transform="translate(890, 14)">
        <rect x="0" y="0" width="160" height="38" rx="8" fill="#2563EB" />
        <path d="M25 19 H37 M31 13 V25" stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linecap="round"/>
        <text x="45" y="24" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF">Thêm danh mục</text>
      </g>

      <rect x="30" y="80" width="1020" height="44" rx="8" fill="#F8FAFC" />
      <text x="60" y="107" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#64748B">Số thứ tự</text>
      <text x="220" y="107" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#64748B">Tên danh mục</text>
      <text x="760" y="107" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#64748B" text-anchor="middle">Số sản phẩm</text>
      <text x="960" y="107" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#64748B" text-anchor="middle">Thao tác</text>

      <g id="Table_Rows" transform="translate(0, 130)">
        
        <g id="Row_1" transform="translate(0, 0)">
          <text x="60" y="35" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#0F172A">1</text>
          
          <rect x="205" y="15" width="450" height="36" rx="6" fill="#F8FAFC" stroke="transparent" stroke-width="1.5" />
          <text x="220" y="38" font-family="Arial, sans-serif" font-size="15" fill="#0F172A">Áo sơ mi</text>
          
          <text x="760" y="35" font-family="Arial, sans-serif" font-size="15" fill="#475569" text-anchor="middle">45</text>
          
          <g style="cursor: pointer;" transform="translate(950, 18)">
            <path d="M5 15 L15 5 L19 9 L9 19 H5 V15 Z M15 5 L19 9" stroke="#64748B" stroke-width="1.5" fill="none" stroke-linejoin="round" />
          </g>
          
          <line x1="30" y1="60" x2="1050" y2="60" stroke="#E2E8F0" stroke-width="1" />
        </g>

        <g id="Row_2_Editing" transform="translate(0, 60)">
          <rect x="30" y="0" width="1020" height="60" fill="#EFF6FF" opacity="0.3" />
          <text x="60" y="35" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#0F172A">2</text>
          
          <rect x="205" y="12" width="450" height="36" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5" filter="url(#shadow-sm)" />
          <text x="220" y="35" font-family="Arial, sans-serif" font-size="15" fill="#0F172A">Quần dài</text>
          <line x1="288" y1="20" x2="288" y2="40" stroke="#0F172A" stroke-width="1.5" />
          
          <text x="760" y="35" font-family="Arial, sans-serif" font-size="15" fill="#475569" text-anchor="middle">30</text>
          
          <g style="cursor: pointer;" transform="translate(946, 16)">
            <rect x="0" y="0" width="28" height="28" rx="6" fill="#DCFCE7" />
            <path d="M8 14 L12 18 L20 10" stroke="#16A34A" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" />
          </g>
          
          <line x1="30" y1="60" x2="1050" y2="60" stroke="#E2E8F0" stroke-width="1" />
        </g>

        <g id="Row_3" transform="translate(0, 120)">
          <text x="60" y="35" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#0F172A">3</text>
          
          <rect x="205" y="15" width="450" height="36" rx="6" fill="#F8FAFC" stroke="transparent" stroke-width="1.5" />
          <text x="220" y="38" font-family="Arial, sans-serif" font-size="15" fill="#0F172A">Phụ kiện</text>
          
          <text x="760" y="35" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#EF4444" text-anchor="middle">0</text>
          
          <g style="cursor: pointer;" transform="translate(950, 18)">
            <path d="M5 15 L15 5 L19 9 L9 19 H5 V15 Z M15 5 L19 9" stroke="#64748B" stroke-width="1.5" fill="none" stroke-linejoin="round" />
          </g>
          
          <line x1="30" y1="60" x2="1050" y2="60" stroke="#E2E8F0" stroke-width="1" />
        </g>

        <g id="Row_4" transform="translate(0, 180)">
          <text x="60" y="35" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#0F172A">4</text>
          
          <rect x="205" y="15" width="450" height="36" rx="6" fill="#F8FAFC" stroke="transparent" stroke-width="1.5" />
          <text x="220" y="38" font-family="Arial, sans-serif" font-size="15" fill="#0F172A">Áo khoác</text>
          
          <text x="760" y="35" font-family="Arial, sans-serif" font-size="15" fill="#475569" text-anchor="middle">24</text>
          
          <g style="cursor: pointer;" transform="translate(950, 18)">
            <path d="M5 15 L15 5 L19 9 L9 19 H5 V15 Z M15 5 L19 9" stroke="#64748B" stroke-width="1.5" fill="none" stroke-linejoin="round" />
          </g>
          
          <line x1="30" y1="60" x2="1050" y2="60" stroke="#E2E8F0" stroke-width="1" />
        </g>
      </g>

      <g id="Pagination" transform="translate(0, 430)">
        <g style="cursor: pointer;" transform="translate(420, 0)">
          <rect x="0" y="0" width="36" height="36" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" />
          <path d="M21 12 L15 18 L21 24" stroke="#64748B" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        </g>
        
        <g style="cursor: pointer;" transform="translate(466, 0)">
          <rect x="0" y="0" width="36" height="36" rx="8" fill="#2563EB" />
          <text x="18" y="23" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
        </g>

        <g style="cursor: pointer;" transform="translate(512, 0)">
          <rect x="0" y="0" width="36" height="36" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" />
          <text x="18" y="23" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#475569" text-anchor="middle">2</text>
        </g>

        <g style="cursor: pointer;" transform="translate(558, 0)">
          <rect x="0" y="0" width="36" height="36" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" />
          <text x="18" y="23" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#475569" text-anchor="middle">3</text>
        </g>

        <text x="616" y="23" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#94A3B8" text-anchor="middle">...</text>

        <g style="cursor: pointer;" transform="translate(640, 0)">
          <rect x="0" y="0" width="36" height="36" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" />
          <path d="M15 12 L21 18 L15 24" stroke="#64748B" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        </g>
      </g>

    </g>
  </g>
</svg>