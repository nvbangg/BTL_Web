<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1024" width="1440" height="1024">
  <defs>
    <linearGradient id="heroGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="50%" stop-color="#EFF6FF" />
      <stop offset="100%" stop-color="#DBEAFE" />
    </linearGradient>
    
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#2563EB" flood-opacity="0.15"/>
    </filter>
    <filter id="toastShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#10B981" flood-opacity="0.2"/>
    </filter>
    <filter id="panelShadow" x="-10%" y="0%" width="120%" height="100%">
      <feDropShadow dx="-8" dy="0" stdDeviation="15" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <g id="Background_Page">
    <rect width="1440" height="1024" fill="url(#heroGradient)" />
    <circle cx="150" cy="350" r="300" fill="#BFDBFE" opacity="0.4" />
    <circle cx="1300" cy="650" r="400" fill="#93C5FD" opacity="0.3" />
    <circle cx="850" cy="200" r="150" fill="#DBEAFE" opacity="0.6" />
  </g>

  <g id="Header">
    <rect width="1440" height="80" fill="none" />
    
    <g id="Logo_Header" style="cursor: pointer;">
      <circle cx="146" cy="40" r="16" fill="#2563EB" />
      <circle cx="162" cy="40" r="16" fill="#60A5FA" opacity="0.8" />
      <text x="190" y="48" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="#0F172A">Fashon Shop</text>
    </g>

    <g id="Search_Bar">
      <rect x="400" y="16" width="640" height="48" rx="24" fill="#FFFFFF" filter="url(#shadow)" />
      
      <circle cx="430" cy="40" r="7" stroke="#64748B" stroke-width="2" fill="none" />
      <path d="M435 45 L441 51" stroke="#64748B" stroke-width="2" stroke-linecap="round" />
      
      <text x="460" y="46" font-family="Arial, sans-serif" font-size="15" fill="#94A3B8">Tìm kiếm quần áo...</text>
      
      <rect x="930" y="20" width="100" height="40" rx="20" fill="#2563EB" style="cursor: pointer;" />
      <text x="980" y="45" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Tìm kiếm</text>
    </g>

    <g id="User_Profile" style="cursor: pointer;">
      <circle cx="1181" cy="40" r="18" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5" />
      <circle cx="1181" cy="35" r="6" stroke="#94A3B8" stroke-width="1.5" fill="none" />
      <path d="M1169 48 C1169 41 1193 41 1193 48" stroke="#94A3B8" stroke-width="1.5" fill="none" />
      
      <text x="1211" y="46" font-family="Arial, sans-serif" font-size="18" font-weight="600" fill="#0F172A">nvbangg</text>
      <path d="M1296 37 L1303 44 L1310 37" stroke="#0F172A" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    </g>
  </g>

  <g id="Search_Page_Content">
    
    <g id="Sorting_And_Filters_Row">
      <text x="130" y="140" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#0F172A">Sắp xếp theo:</text>
      
      <g id="Sort_BestSeller" style="cursor: pointer;">
        <rect x="270" y="115" width="140" height="36" rx="18" fill="#F1F5F9" />
        <text x="340" y="138" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#0F172A" text-anchor="middle">Bán chạy nhất</text>
      </g>

      <g id="Sort_Newest" style="cursor: pointer;">
        <rect x="425" y="115" width="100" height="36" rx="18" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" />
        <text x="475" y="138" font-family="Arial, sans-serif" font-size="15" fill="#475569" text-anchor="middle">Mới nhất</text>
      </g>

      <g id="Sort_Price_Asc" style="cursor: pointer;">
        <rect x="540" y="115" width="100" height="36" rx="18" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" />
        <text x="590" y="138" font-family="Arial, sans-serif" font-size="15" fill="#475569" text-anchor="middle">Giá tăng</text>
      </g>

      <g id="Sort_Price_Desc" style="cursor: pointer;">
        <rect x="655" y="115" width="100" height="36" rx="18" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" />
        <text x="705" y="138" font-family="Arial, sans-serif" font-size="15" fill="#475569" text-anchor="middle">Giá giảm</text>
      </g>

      <g id="Button_Filter" style="cursor: pointer;">
        <rect x="1190" y="110" width="120" height="46" rx="23" fill="#FFFFFF" filter="url(#shadow)" />
        <path d="M1215 125 L1235 125 L1227 135 L1227 143 L1223 140 L1223 135 Z" stroke="#0F172A" stroke-width="1.5" fill="none" stroke-linejoin="round"/>
        <text x="1255" y="138" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#0F172A" text-anchor="middle">Lọc</text>
      </g>
    </g>

    <g id="Product_Row_1">
      <g id="Card_1">
        <rect x="130" y="180" width="280" height="360" rx="12" fill="#FCE7F3" />
        <text x="130" y="570" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#0F172A">399.000đ</text>
        <text x="130" y="600" font-family="Arial, sans-serif" font-size="15" fill="#475569">Áo Sơ-mi Ngắn Tay asymmetrical...</text>
      </g>
      
      <g id="Card_2">
        <rect x="430" y="180" width="280" height="360" rx="12" fill="#FFE4E6" />
        <text x="430" y="570" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#0F172A">449.000đ</text>
        <text x="430" y="600" font-family="Arial, sans-serif" font-size="15" fill="#475569">Áo Sơ-mi Ngắn Tay Raglan collection</text>
      </g>

      <g id="Card_3">
        <rect x="730" y="180" width="280" height="360" rx="12" fill="#FBCFE8" />
        <text x="730" y="570" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#0F172A">349.000đ</text>
        <text x="730" y="600" font-family="Arial, sans-serif" font-size="15" fill="#475569">Áo Không Tay Thêu Hoa Collection</text>
      </g>

      <g id="Card_4">
        <rect x="1030" y="180" width="280" height="360" rx="12" fill="#FCE7F3" />
        <text x="1030" y="570" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#0F172A">399.000đ</text>
        <text x="1030" y="600" font-family="Arial, sans-serif" font-size="15" fill="#475569">Áo Sơ-mi Ngắn Tay Relax Fit Collection</text>
      </g>
    </g>

    <g id="Product_Row_2">
      <rect x="130" y="640" width="280" height="360" rx="12" fill="#FBCFE8" />
      <rect x="430" y="640" width="280" height="360" rx="12" fill="#FFE4E6" />
      <rect x="730" y="640" width="280" height="360" rx="12" fill="#F1F5F9" />
      <rect x="1030" y="640" width="280" height="360" rx="12" fill="#E2E8F0" />
    </g>
  </g>

  <g id="Toast_Success">
    <rect x="1080" y="920" width="320" height="64" rx="12" fill="#FFFFFF" filter="url(#toastShadow)" stroke="#10B981" stroke-width="1.5" />
    <circle cx="1120" cy="952" r="14" fill="#10B981" />
    <path d="M1114 952 L1118 957 L1126 947" stroke="#FFFFFF" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1145" y="958" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#0F172A">Đăng nhập thành công</text>
  </g>

  <g id="Filter_Panel">
    <rect x="960" y="0" width="480" height="1024" fill="#FFFFFF" filter="url(#panelShadow)" />
    
    <path d="M1430 85 L1434 80 L1438 85" fill="#64748B"/>
    <path d="M1430 805 L1434 810 L1438 805" fill="#64748B"/>

    <text x="1000" y="55" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#0F172A">Bộ lọc</text>
    <g id="Button_Close_Filter" style="cursor: pointer;">
      <circle cx="1380" cy="48" r="18" fill="none" stroke="#CBD5E1" stroke-width="1.5" />
      <path d="M1373 41 L1387 55 M1387 41 L1373 55" stroke="#64748B" stroke-width="1.5" stroke-linecap="round" />
    </g>
    <line x1="960" y1="80" x2="1440" y2="80" stroke="#E2E8F0" stroke-width="1" />

    <g id="Filter_Scroll_Content" transform="translate(0, 110)">
      
      <g id="Section_Category">
        <text x="1000" y="0" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1E293B">Danh mục</text>
        <rect x="1000" y="15" width="390" height="48" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" />
        <text x="1015" y="44" font-family="Arial, sans-serif" font-size="15" fill="#64748B">Chọn danh mục</text>
        <path d="M1365 35 L1372 42 L1379 35" stroke="#64748B" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" />
      </g>

      <g id="Section_Gender" transform="translate(0, 90)">
        <text x="1000" y="0" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1E293B">Giới tính</text>
        <rect x="1000" y="15" width="390" height="48" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" />
        <text x="1015" y="44" font-family="Arial, sans-serif" font-size="15" fill="#64748B">Chọn giới tính</text>
        <path d="M1365 35 L1372 42 L1379 35" stroke="#64748B" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" />
      </g>

      <g id="Section_Color" transform="translate(0, 180)">
        <text x="1000" y="0" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1E293B">Màu sắc</text>
        <rect x="1000" y="15" width="390" height="48" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" />
        <text x="1015" y="44" font-family="Arial, sans-serif" font-size="15" fill="#64748B">Chọn màu sắc</text>
        <path d="M1365 35 L1372 42 L1379 35" stroke="#64748B" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" />
      </g>

      <g id="Section_Size" transform="translate(0, 270)">
        <text x="1000" y="0" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1E293B">Size</text>
        <rect x="1000" y="15" width="390" height="48" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" />
        <text x="1015" y="44" font-family="Arial, sans-serif" font-size="15" fill="#64748B">Chọn size</text>
        <path d="M1365 35 L1372 42 L1379 35" stroke="#64748B" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" />
      </g>

      <g id="Section_Price" transform="translate(0, 380)">
        <text x="1000" y="0" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1E293B">Giá tiền</text>
        
        <rect x="1000" y="15" width="180" height="48" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" />
        <text x="1015" y="44" font-family="Arial, sans-serif" font-size="15" fill="#94A3B8">Giá tối thiểu</text>
        
        <line x1="1188" y1="39" x2="1198" y2="39" stroke="#64748B" stroke-width="2" stroke-linecap="round" />
        
        <rect x="1205" y="15" width="185" height="48" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" />
        <text x="1220" y="44" font-family="Arial, sans-serif" font-size="15" fill="#94A3B8">Giá tối đa</text>
      </g>

    </g>

    <g id="Filter_Footer">
      <line x1="960" y1="910" x2="1440" y2="910" stroke="#E2E8F0" stroke-width="1" />
      <rect x="960" y="911" width="480" height="113" fill="#FFFFFF" />
      
      <rect x="1000" y="935" width="110" height="54" rx="27" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" style="cursor: pointer;" />
      <text x="1055" y="967" font-family="Arial, sans-serif" font-size="16" fill="#0F172A" text-anchor="middle">Xóa lọc</text>

      <rect x="1130" y="935" width="260" height="54" rx="27" fill="#FBBF24" style="cursor: pointer;" />
      <text x="1260" y="967" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#0F172A" text-anchor="middle">Áp dụng</text>
    </g>
  </g>
</svg>
