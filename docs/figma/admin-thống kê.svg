<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1024" width="1440" height="1024">
  <defs>
    <filter id="shadow-sm" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.05"/>
    </filter>
    <filter id="shadow-md" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
    
    <linearGradient id="barGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <linearGradient id="barGradientHover" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
  </defs>

  <rect width="1440" height="1024" fill="#F1F5F9" />

  <rect x="0" y="0" width="280" height="1024" fill="#FFFFFF" filter="url(#shadow-md)" />
  
  <g id="Logo_Header" style="cursor: pointer;" transform="translate(14, 0)">
    <circle cx="50" cy="50" r="16" fill="#2563EB" />
    <circle cx="66" cy="50" r="16" fill="#60A5FA" opacity="0.8" />
    <text x="95" y="58" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="#0F172A">Fashon Shop</text>
  </g>

  <g id="Sidebar_Menu" transform="translate(0, 130)">
    
    <g id="Nav_Dashboard" style="cursor: pointer;">
      <rect x="16" y="0" width="248" height="52" rx="12" fill="#EFF6FF" />
      <rect x="16" y="10" width="4" height="32" rx="2" fill="#2563EB" />
      <path d="M45 35 V17 M55 35 V25 M65 35 V13" stroke="#2563EB" stroke-width="2.5" stroke-linecap="round" fill="none"/>
      <path d="M35 38 H75" stroke="#2563EB" stroke-width="2.5" stroke-linecap="round" fill="none"/>
      <text x="90" y="32" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2563EB">Xem thống kê</text>
    </g>

    <g id="Nav_Orders" transform="translate(0, 60)" style="cursor: pointer;">
      <rect x="16" y="0" width="248" height="52" rx="12" fill="transparent" />
      <path d="M40 20 L55 13 L70 20 V32 L55 39 L40 32 Z" stroke="#64748B" stroke-width="2" fill="none" stroke-linejoin="round"/>
      <path d="M40 20 L55 27 L70 20 M55 27 V39" stroke="#64748B" stroke-width="2" fill="none" stroke-linejoin="round"/>
      <text x="90" y="32" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#475569">Quản lý đơn hàng</text>
      <rect x="230" y="16" width="24" height="20" rx="10" fill="#EF4444" />
      <text x="242" y="31" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">5</text>
    </g>

    <g id="Nav_Products" transform="translate(0, 120)" style="cursor: pointer;">
      <rect x="16" y="0" width="248" height="52" rx="12" fill="transparent" />
      <path d="M45 15 L55 20 L65 15 L70 25 L65 30 V38 H45 V30 L40 25 Z" stroke="#64748B" stroke-width="2" fill="none" stroke-linejoin="round"/>
      <text x="90" y="32" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#475569">Quản lý sản phẩm</text>
    </g>

    <g id="Nav_Users" transform="translate(0, 180)" style="cursor: pointer;">
      <rect x="16" y="0" width="248" height="52" rx="12" fill="transparent" />
      <circle cx="55" cy="20" r="6" stroke="#64748B" stroke-width="2" fill="none"/>
      <path d="M43 36 C43 30 67 30 67 36" stroke="#64748B" stroke-width="2" fill="none" stroke-linecap="round"/>
      <text x="90" y="32" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#475569">Quản lý người dùng</text>
    </g>
  </g>

  <g id="User_Dropup_Menu">
    <rect x="16" y="750" width="248" height="155" rx="12" fill="#FFFFFF" filter="url(#shadow-md)" stroke="#E2E8F0" stroke-width="1" />
    
    <g id="Menu_Item_User_Page" style="cursor: pointer;">
      <rect x="26" y="760" width="228" height="40" rx="8" fill="#F8FAFC" />
      <path d="M55 780 H35 M35 780 L42 773 M35 780 L42 787" stroke="#0F172A" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="66" y="785" font-family="Arial, sans-serif" font-size="16" fill="#0F172A">Trang người dùng</text>
    </g>
    
    <g id="Menu_Item_Change_Password" style="cursor: pointer;">
      <rect x="26" y="800" width="228" height="40" rx="8" fill="none" />
      <path d="M41 815 V812 A 4 4 0 0 1 49 812 V815" stroke="#475569" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="39" y="815" width="12" height="10" rx="2" stroke="#475569" stroke-width="1.5" fill="none"/>
      <circle cx="45" cy="820" r="1.5" fill="#475569" />
      <text x="66" y="825" font-family="Arial, sans-serif" font-size="16" fill="#475569">Đổi mật khẩu</text>
    </g>

    <path d="M16 845 L264 845" stroke="#E2E8F0" stroke-width="1" />
    
    <g id="Menu_Item_Logout" style="cursor: pointer;">
      <rect x="26" y="850" width="228" height="40" rx="8" fill="none" />
      <path d="M47 863 H41 V877 H47 M50 866 L54 870 L50 874 M44 870 H54" stroke="#EF4444" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="66" y="875" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#EF4444">Đăng xuất</text>
    </g>
  </g>

  <g id="Sidebar_Footer" transform="translate(0, 920)">
    <line x1="16" y1="0" x2="264" y2="0" stroke="#E2E8F0" stroke-width="1" />
    <g id="User_Profile" style="cursor: pointer;" transform="translate(16, 20)">
      <circle cx="30" cy="30" r="18" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5" />
      <circle cx="30" cy="25" r="6" stroke="#94A3B8" stroke-width="1.5" fill="none" />
      <path d="M18 38 C18 31 42 31 42 38" stroke="#94A3B8" stroke-width="1.5" fill="none" />
      <text x="60" y="36" font-family="Arial, sans-serif" font-size="18" font-weight="600" fill="#0F172A">nvbangg</text>
      <path d="M220 34 L227 27 L234 34" stroke="#0F172A" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    </g>
  </g>

  <g id="Top_Header" transform="translate(280, 0)">
    <rect width="1160" height="80" fill="#FFFFFF" filter="url(#shadow-sm)" />
    <text x="40" y="48" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#0F172A">Tổng quan thống kê</text>
  </g>

  <g id="Dashboard_Content" transform="translate(320, 110)">
    
    <g id="Card_Month">
      <rect x="0" y="0" width="340" height="130" rx="16" fill="#FFFFFF" filter="url(#shadow-md)" />
      <rect x="20" y="20" width="48" height="48" rx="12" fill="#DBEAFE" />
      <path d="M36 36 V48 M52 36 V48 M28 42 H60 M32 30 H56 C58 30 60 32 60 34 V54 C60 56 58 58 56 58 H32 C30 58 28 56 28 54 V34 C28 32 30 30 32 30 Z" stroke="#2563EB" stroke-width="2" fill="none" stroke-linejoin="round" transform="translate(0, -10)"/>
      
      <text x="85" y="40" font-family="Arial, sans-serif" font-size="16" fill="#64748B">Doanh thu tháng này</text>
      <text x="20" y="100" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#0F172A">128.500.000đ</text>
    </g>

    <g id="Card_Year" transform="translate(370, 0)">
      <rect x="0" y="0" width="340" height="130" rx="16" fill="#FFFFFF" filter="url(#shadow-md)" />
      <rect x="20" y="20" width="48" height="48" rx="12" fill="#FEF3C7" />
      <path d="M30 55 V40 L42 48 L56 32 M50 32 H56 V38" stroke="#D97706" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" transform="translate(0, -5)"/>
      <path d="M28 30 H60 C62 30 64 32 64 34 V54 C64 56 62 58 60 58 H28 C26 58 24 56 24 54 V34 C24 32 26 30 28 30 Z" stroke="#D97706" stroke-width="2" fill="none" stroke-linejoin="round" transform="translate(0, -5)"/>
      
      <text x="85" y="40" font-family="Arial, sans-serif" font-size="16" fill="#64748B">Doanh thu năm nay</text>
      <text x="20" y="100" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#0F172A">1.450.000.000đ</text>
    </g>

    <g id="Card_Total" transform="translate(740, 0)">
      <rect x="0" y="0" width="340" height="130" rx="16" fill="#FFFFFF" filter="url(#shadow-md)" />
      <rect x="20" y="20" width="48" height="48" rx="12" fill="#FCE7F3" />
      <path d="M30 35 H58 C60 35 62 37 62 39 V51 C62 53 60 55 58 55 H30 C28 55 26 53 26 51 V39 C26 37 28 35 30 35 Z" stroke="#DB2777" stroke-width="2" fill="none" stroke-linejoin="round" transform="translate(0, -5)"/>
      <path d="M26 43 H62 M52 47 A1 1 0 1 0 52 47.1" stroke="#DB2777" stroke-width="2" stroke-linecap="round" fill="none" transform="translate(0, -5)"/>
      <path d="M30 35 V31 C30 29 32 27 34 27 H54 C56 27 58 29 58 31 V35" stroke="#DB2777" stroke-width="2" fill="none" stroke-linejoin="round" transform="translate(0, -5)"/>
      
      <text x="85" y="40" font-family="Arial, sans-serif" font-size="16" fill="#64748B">Tổng doanh thu toàn thời gian</text>
      <text x="20" y="100" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#0F172A">4.850.000.000đ</text>
    </g>

    <g id="Chart_Section" transform="translate(0, 160)">
      <rect x="0" y="0" width="1080" height="600" rx="16" fill="#FFFFFF" filter="url(#shadow-md)" />
      
      <text x="30" y="40" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#0F172A">Biểu đồ doanh thu</text>
      
      <g id="Year_Filter" transform="translate(940, 15)" style="cursor: pointer;">
        <rect x="0" y="0" width="110" height="36" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" />
        <text x="15" y="23" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#0F172A">Năm 2026</text>
        <path d="M90 15 L95 21 L100 15" stroke="#64748B" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      </g>

      <g id="Chart_Grid" transform="translate(30, 80)">
        
        <line x1="60" y1="0" x2="1020" y2="0" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="4 4" />
        <text x="45" y="5" font-family="Arial, sans-serif" font-size="13" fill="#64748B" text-anchor="end">300M</text>
        
        <line x1="60" y1="100" x2="1020" y2="100" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="4 4" />
        <text x="45" y="105" font-family="Arial, sans-serif" font-size="13" fill="#64748B" text-anchor="end">200M</text>
        
        <line x1="60" y1="200" x2="1020" y2="200" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="4 4" />
        <text x="45" y="205" font-family="Arial, sans-serif" font-size="13" fill="#64748B" text-anchor="end">100M</text>
        
        <line x1="60" y1="300" x2="1020" y2="300" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="4 4" />
        <text x="45" y="305" font-family="Arial, sans-serif" font-size="13" fill="#64748B" text-anchor="end">50M</text>

        <line x1="60" y1="400" x2="1020" y2="400" stroke="#94A3B8" stroke-width="1.5" />
        <text x="45" y="405" font-family="Arial, sans-serif" font-size="13" fill="#64748B" text-anchor="end">0</text>

        <g id="Bar_Jan" transform="translate(80, 0)">
          <rect x="0" y="200" width="40" height="200" rx="4" fill="url(#barGradient)" />
          <text x="20" y="430" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#64748B" text-anchor="middle">T1</text>
        </g>
        
        <g id="Bar_Feb" transform="translate(160, 0)">
          <rect x="0" y="240" width="40" height="160" rx="4" fill="url(#barGradient)" />
          <text x="20" y="430" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#64748B" text-anchor="middle">T2</text>
        </g>
        
        <g id="Bar_Mar_Active" transform="translate(240, 0)">
          <rect x="-20" y="140" width="80" height="30" rx="6" fill="#0F172A" />
          <polygon points="15,170 25,170 20,175" fill="#0F172A" />
          <text x="20" y="160" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">128.5M</text>
          
          <rect x="0" y="180" width="40" height="220" rx="4" fill="url(#barGradientHover)" />
          <text x="20" y="430" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2563EB" text-anchor="middle">T3</text>
        </g>
        
        <g id="Bar_Apr" transform="translate(320, 0)">
          <text x="20" y="430" font-family="Arial, sans-serif" font-size="14" fill="#94A3B8" text-anchor="middle">T4</text>
        </g>
        <g transform="translate(400, 0)">
          <text x="20" y="430" font-family="Arial, sans-serif" font-size="14" fill="#94A3B8" text-anchor="middle">T5</text>
        </g>
        <g transform="translate(480, 0)">
          <text x="20" y="430" font-family="Arial, sans-serif" font-size="14" fill="#94A3B8" text-anchor="middle">T6</text>
        </g>
        <g transform="translate(560, 0)">
          <text x="20" y="430" font-family="Arial, sans-serif" font-size="14" fill="#94A3B8" text-anchor="middle">T7</text>
        </g>
        <g transform="translate(640, 0)">
          <text x="20" y="430" font-family="Arial, sans-serif" font-size="14" fill="#94A3B8" text-anchor="middle">T8</text>
        </g>
        <g transform="translate(720, 0)">
          <text x="20" y="430" font-family="Arial, sans-serif" font-size="14" fill="#94A3B8" text-anchor="middle">T9</text>
        </g>
        <g transform="translate(800, 0)">
          <text x="20" y="430" font-family="Arial, sans-serif" font-size="14" fill="#94A3B8" text-anchor="middle">T10</text>
        </g>
        <g transform="translate(880, 0)">
          <text x="20" y="430" font-family="Arial, sans-serif" font-size="14" fill="#94A3B8" text-anchor="middle">T11</text>
        </g>
        <g transform="translate(960, 0)">
          <text x="20" y="430" font-family="Arial, sans-serif" font-size="14" fill="#94A3B8" text-anchor="middle">T12</text>
        </g>
      </g>
    </g>

  </g>
</svg>
