<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1024" width="1440" height="1024">
  <defs>
    <filter id="shadow-sm" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.05"/>
    </filter>
    <filter id="shadow-md" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
    <filter id="popupShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="1440" height="1024" fill="#F1F5F9" />

  <rect x="0" y="0" width="280" height="1024" fill="#FFFFFF" filter="url(#shadow-md)" />
  
  <g id="Logo_Header" style="cursor: pointer;">
    <circle cx="45" cy="50" r="16" fill="#2563EB" />
    <circle cx="61" cy="50" r="16" fill="#60A5FA" opacity="0.8" />
    <text x="90" y="58" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="#0F172A">Fashon Shop</text>
  </g>

  <g id="Sidebar_Menu" transform="translate(0, 130)">
    <g id="Nav_Dashboard" style="cursor: pointer;">
      <rect x="16" y="0" width="248" height="52" rx="12" fill="transparent" />
      <path d="M45 35 V17 M55 35 V25 M65 35 V13" stroke="#475569" stroke-width="2.5" stroke-linecap="round" fill="none"/>
      <path d="M35 38 H75" stroke="#475569" stroke-width="2.5" stroke-linecap="round" fill="none"/>
      <text x="90" y="32" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#475569">Xem thống kê</text>
    </g>

    <g id="Nav_Orders" transform="translate(0, 60)" style="cursor: pointer;">
      <rect x="16" y="0" width="248" height="52" rx="12" fill="transparent" />
      <path d="M40 20 L55 13 L70 20 V32 L55 39 L40 32 Z" stroke="#475569" stroke-width="2" fill="none" stroke-linejoin="round"/>
      <path d="M40 20 L55 27 L70 20 M55 27 V39" stroke="#475569" stroke-width="2" fill="none" stroke-linejoin="round"/>
      <text x="90" y="32" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#475569">Quản lý đơn hàng</text>
      <rect x="230" y="16" width="24" height="20" rx="10" fill="#EF4444" />
      <text x="242" y="31" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">12</text>
    </g>

    <g id="Nav_Products" transform="translate(0, 120)" style="cursor: pointer;">
      <rect x="16" y="0" width="248" height="52" rx="12" fill="#EFF6FF" />
      <rect x="16" y="10" width="4" height="32" rx="2" fill="#2563EB" />
      <path d="M45 15 L55 20 L65 15 L70 25 L65 30 V38 H45 V30 L40 25 Z" stroke="#2563EB" stroke-width="2" fill="none" stroke-linejoin="round"/>
      <text x="90" y="32" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2563EB">Quản lý sản phẩm</text>
    </g>

    <g id="Nav_Categories" transform="translate(0, 180)" style="cursor: pointer;">
      <rect x="16" y="0" width="248" height="52" rx="12" fill="transparent" />
      <path d="M45 18 H55 L68 31 C70 33 70 36 68 38 L65 41 C63 43 60 43 58 41 L45 28 V18 Z" stroke="#475569" stroke-width="2" fill="none" stroke-linejoin="round"/>
      <circle cx="51" cy="24" r="2" fill="#475569" />
      <text x="90" y="32" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#475569">Quản lý danh mục</text>
    </g>
  </g>

  <g id="Sidebar_Footer" transform="translate(0, 920)">
    <line x1="16" y1="0" x2="264" y2="0" stroke="#E2E8F0" stroke-width="1" />
    <g style="cursor: pointer;" transform="translate(16, 30)">
      <rect x="0" y="0" width="248" height="52" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" />
      <path d="M35 26 H15 M15 26 L22 19 M15 26 L22 33" stroke="#475569" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="55" y="32" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#475569">Về trang người dùng</text>
    </g>
  </g>

  <g id="Top_Header" transform="translate(280, 0)">
    <rect width="1160" height="80" fill="#FFFFFF" filter="url(#shadow-sm)" />
    <text x="40" y="48" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#0F172A">Quản lý sản phẩm</text>
  </g>

  <g id="Dashboard_Content" transform="translate(320, 110)">
    <g id="Card_Total_Products">
      <rect x="0" y="0" width="340" height="130" rx="16" fill="#FFFFFF" filter="url(#shadow-md)" />
      <rect x="20" y="20" width="48" height="48" rx="12" fill="#F1F5F9" />
      <path d="M36 34 L44 38 L52 34 L56 42 L52 46 V52 H36 V46 L32 42 Z" stroke="#64748B" stroke-width="2" fill="none" stroke-linejoin="round" transform="translate(0, -5)"/>
      <text x="85" y="40" font-family="Arial, sans-serif" font-size="16" fill="#64748B">Tổng số sản phẩm</text>
      <text x="20" y="95" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#0F172A">156</text>
    </g>

    <g id="Card_Active" transform="translate(370, 0)">
      <rect x="0" y="0" width="340" height="130" rx="16" fill="#FFFFFF" filter="url(#shadow-md)" />
      <rect x="20" y="20" width="48" height="48" rx="12" fill="#DCFCE7" />
      <circle cx="44" cy="44" r="14" fill="none" stroke="#16A34A" stroke-width="2" transform="translate(0, -10)"/>
      <path d="M38 44 L42 48 L50 38" stroke="#16A34A" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" transform="translate(0, -10)"/>
      <text x="85" y="40" font-family="Arial, sans-serif" font-size="16" fill="#64748B">Sản phẩm đang kinh doanh</text>
      <text x="20" y="95" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#0F172A">142</text>
    </g>

    <g id="Card_Out_Of_Stock" transform="translate(740, 0)">
      <rect x="0" y="0" width="340" height="130" rx="16" fill="#FFFFFF" filter="url(#shadow-md)" />
      <rect x="20" y="20" width="48" height="48" rx="12" fill="#FEE2E2" />
      <circle cx="44" cy="44" r="14" fill="none" stroke="#EF4444" stroke-width="2" transform="translate(0, -10)"/>
      <path d="M44 38 V45 M44 50 V50.1" stroke="#EF4444" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" transform="translate(0, -10)"/>
      <text x="85" y="40" font-family="Arial, sans-serif" font-size="16" fill="#64748B">Sản phẩm hết hàng</text>
      <text x="20" y="95" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#EF4444">14</text>
    </g>

    <g id="Products_Table_Section" transform="translate(0, 160)">
      <rect x="0" y="0" width="1080" height="670" rx="16" fill="#FFFFFF" filter="url(#shadow-md)" />
      <text x="30" y="38" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#0F172A">Danh sách sản phẩm</text>
      
      <g id="Search_Bar" transform="translate(240, 14)">
        <rect x="0" y="0" width="630" height="38" rx="19" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" />
        <circle cx="20" cy="19" r="6" stroke="#64748B" stroke-width="2" fill="none" />
        <path d="M25 24 L31 30" stroke="#64748B" stroke-width="2" stroke-linecap="round" />
        <text x="40" y="24" font-family="Arial, sans-serif" font-size="14" fill="#94A3B8">Tìm kiếm sản phẩm...</text>
      </g>

      <g style="cursor: pointer;" transform="translate(900, 14)">
        <rect x="0" y="0" width="150" height="38" rx="8" fill="#2563EB" />
        <path d="M25 19 H37 M31 13 V25" stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linecap="round"/>
        <text x="45" y="24" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF">Thêm sản phẩm</text>
      </g>

      <rect x="30" y="140" width="1020" height="44" rx="8" fill="#F8FAFC" />
      <text x="50" y="167" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#64748B">Sản phẩm</text>
      <text x="420" y="167" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#64748B">Danh mục</text>
      <text x="580" y="167" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#64748B">Giá bán</text>
      <text x="720" y="167" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#64748B">Tồn kho</text>
      <text x="840" y="167" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#64748B">Trạng thái</text>
      <text x="960" y="167" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#64748B">Thao tác</text>
    </g>
  </g>

  <rect width="1440" height="1024" fill="#0F172A" opacity="0.6" />

  <g id="Popup_Edit_Product">
    <rect x="320" y="50" width="800" height="900" rx="24" fill="#FFFFFF" filter="url(#popupShadow)" />
    
    <text x="360" y="110" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#0F172A">Chỉnh sửa sản phẩm</text>
    <g id="Close_Button" style="cursor: pointer;">
      <circle cx="1060" cy="100" r="16" fill="#F1F5F9" />
      <path d="M1054 94 L1066 106 M1066 94 L1054 106" stroke="#64748B" stroke-width="2" stroke-linecap="round" />
    </g>
    <line x1="320" y1="135" x2="1120" y2="135" stroke="#E2E8F0" stroke-width="1.5" />

    <text x="360" y="165" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#475569">Tên sản phẩm *</text>
    <rect x="360" y="175" width="720" height="42" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" />
    <text x="375" y="202" font-family="Arial, sans-serif" font-size="15" fill="#0F172A">Áo Sơ-mi Ngắn Tay Asymmetrical</text>

    <text x="360" y="245" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#475569">Danh mục *</text>
    <g style="cursor: pointer;">
      <rect x="360" y="255" width="340" height="42" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" />
      <text x="375" y="282" font-family="Arial, sans-serif" font-size="15" fill="#0F172A">Áo sơ mi</text>
      <path d="M670 270 L676 276 L682 270" stroke="#64748B" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <text x="740" y="245" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#475569">Giới tính</text>
    <g style="cursor: pointer;">
      <rect x="740" y="255" width="340" height="42" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" />
      <text x="755" y="282" font-family="Arial, sans-serif" font-size="15" fill="#0F172A">Nam</text>
      <path d="M1050 270 L1056 276 L1062 270" stroke="#64748B" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <text x="360" y="325" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#475569">Giá bán cơ bản (VNĐ) *</text>
    <rect x="360" y="335" width="340" height="42" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" />
    <text x="375" y="362" font-family="Arial, sans-serif" font-size="15" fill="#0F172A">399000</text>

    <text x="740" y="325" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#475569">Trạng thái hiển thị</text>
    <g style="cursor: pointer;" transform="translate(740, 345)">
      <rect x="0" y="0" width="44" height="24" rx="12" fill="#10B981" />
      <circle cx="32" cy="12" r="10" fill="#FFFFFF" />
      <text x="55" y="16" font-family="Arial, sans-serif" font-size="14" fill="#0F172A">Đang bật</text>
    </g>

    <text x="360" y="415" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#475569">Mô tả sản phẩm</text>
    <rect x="360" y="425" width="720" height="80" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" />
    <text x="375" y="445" font-family="Arial, sans-serif" font-size="15" fill="#0F172A">Áo sơ mi form rộng thoải mái, thiết kế vạt áo bất đối xứng độc đáo.</text>
    <text x="375" y="465" font-family="Arial, sans-serif" font-size="15" fill="#0F172A">Chất liệu vải cotton cao cấp thoáng mát, thấm hút mồ hôi tốt.</text>

    <text x="360" y="535" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#475569">Hình ảnh (Ảnh đầu tiên sẽ là Thumbnail)</text>
    
    <g id="Thumbnail_Image">
      <rect x="360" y="545" width="80" height="80" rx="8" fill="#FCE7F3" stroke="#2563EB" stroke-width="2" />
      <text x="400" y="590" font-family="Arial, sans-serif" font-size="12" fill="#0F172A" text-anchor="middle">Img 1</text>
      <polygon points="360,545 385,545 360,570" fill="#2563EB" />
      <path d="M365 553 L367 550 L370 550 L368 548 L369 545 L366 546 L363 545 L364 548 L362 550 L365 550 Z" fill="#FFFFFF" />
    </g>

    <g id="Extra_Image">
      <rect x="455" y="545" width="80" height="80" rx="8" fill="#F1F5F9" />
      <text x="495" y="590" font-family="Arial, sans-serif" font-size="12" fill="#0F172A" text-anchor="middle">Img 2</text>
    </g>

    <g id="Add_Image_Btn" style="cursor: pointer;">
      <rect x="550" y="545" width="80" height="80" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="4 4" />
      <path d="M590 575 V595 M580 585 H600" stroke="#94A3B8" stroke-width="2" fill="none" stroke-linecap="round" />
    </g>

    <text x="360" y="655" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#475569">Phân loại sản phẩm</text>
    
    <rect x="360" y="665" width="720" height="150" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
    
    <rect x="360" y="665" width="720" height="36" fill="#F8FAFC" />
    <line x1="360" y1="701" x2="1080" y2="701" stroke="#E2E8F0" stroke-width="1" />
    <text x="380" y="688" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#64748B">Màu sắc</text>
    <text x="500" y="688" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#64748B">Size</text>
    <text x="640" y="688" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#64748B">Tồn kho</text>
    <text x="760" y="688" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#64748B">Giá tùy chỉnh</text>
    <text x="1010" y="688" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#64748B">Xóa</text>

    <g transform="translate(0, 715)">
      <rect x="380" y="0" width="100" height="32" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" />
      <text x="390" y="20" font-family="Arial, sans-serif" font-size="13" fill="#0F172A">Đen</text>

      <rect x="500" y="0" width="120" height="32" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" />
      <text x="510" y="20" font-family="Arial, sans-serif" font-size="13" fill="#0F172A">M</text>

      <rect x="640" y="0" width="100" height="32" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" />
      <text x="650" y="20" font-family="Arial, sans-serif" font-size="13" fill="#0F172A">100</text>

      <rect x="760" y="0" width="180" height="32" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" />
      <text x="770" y="20" font-family="Arial, sans-serif" font-size="13" fill="#94A3B8">(Để trống lấy giá cơ bản)</text>

      <path d="M1020 10 V8 C1020 7 1021 6 1022 6 H1024 C1025 6 1026 7 1026 8 V10 M1018 10 H1028 M1020 10 V22 C1020 23 1026 23 1026 22 V10" stroke="#EF4444" stroke-width="1.5" fill="none" stroke-linejoin="round" style="cursor: pointer;" />
    </g>

    <g transform="translate(0, 760)">
      <rect x="380" y="0" width="100" height="32" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" />
      <text x="390" y="20" font-family="Arial, sans-serif" font-size="13" fill="#0F172A">Đen</text>

      <rect x="500" y="0" width="120" height="32" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" />
      <text x="510" y="20" font-family="Arial, sans-serif" font-size="13" fill="#0F172A">L</text>

      <rect x="640" y="0" width="100" height="32" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" />
      <text x="650" y="20" font-family="Arial, sans-serif" font-size="13" fill="#0F172A">50</text>

      <rect x="760" y="0" width="180" height="32" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" />
      <text x="770" y="20" font-family="Arial, sans-serif" font-size="13" fill="#94A3B8">(Để trống lấy giá cơ bản)</text>

      <path d="M1020 10 V8 C1020 7 1021 6 1022 6 H1024 C1025 6 1026 7 1026 8 V10 M1018 10 H1028 M1020 10 V22 C1020 23 1026 23 1026 22 V10" stroke="#EF4444" stroke-width="1.5" fill="none" stroke-linejoin="round" style="cursor: pointer;" />
    </g>

    <text x="380" y="835" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2563EB" style="cursor: pointer;">+ Thêm phân loại</text>


    <line x1="320" y1="870" x2="1120" y2="870" stroke="#E2E8F0" stroke-width="1.5" />

    <g id="Button_Delete_Product" style="cursor: pointer;">
      <rect x="360" y="885" width="160" height="44" rx="8" fill="#FEE2E2" />
      <path d="M375 905 V903 C375 901 377 901 377 901 H381 C381 901 383 901 383 903 V905 M373 905 H385 M375 905 V917 C375 919 383 919 383 917 V905" stroke="#EF4444" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round" />
      <text x="395" y="912" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#EF4444">Xóa sản phẩm</text>
    </g>

    <g id="Button_Cancel" style="cursor: pointer;">
      <rect x="820" y="885" width="110" height="44" rx="8" fill="#F1F5F9" />
      <text x="875" y="912" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#475569" text-anchor="middle">Hủy</text>
    </g>

    <g id="Button_Save" style="cursor: pointer;">
      <rect x="940" y="885" width="140" height="44" rx="8" fill="#2563EB" />
      <text x="1010" y="912" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Lưu thay đổi</text>
    </g>

  </g>
</svg>