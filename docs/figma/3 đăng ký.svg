<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1024" width="1440" height="1024">
  <defs>
    <linearGradient id="heroGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="50%" stop-color="#EFF6FF" />
      <stop offset="100%" stop-color="#DBEAFE" />
    </linearGradient>
    
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#2563EB" flood-opacity="0.15"/>
    </filter>
    <filter id="popupShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="30" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <g id="Background_Page">
    <rect width="1440" height="1024" fill="url(#heroGradient)" />
    <circle cx="150" cy="350" r="300" fill="#BFDBFE" opacity="0.4" />
    <circle cx="1300" cy="650" r="400" fill="#93C5FD" opacity="0.3" />
    <circle cx="850" cy="200" r="150" fill="#DBEAFE" opacity="0.6" />
  </g>

  <g id="Header">
    <rect width="1440" height="80" fill="none" />
    
    <g id="Logo_Header" style="cursor: pointer;">
      <circle cx="146" cy="40" r="16" fill="#2563EB" />
      <circle cx="162" cy="40" r="16" fill="#60A5FA" opacity="0.8" />
      <text x="190" y="48" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="#0F172A">Fashon Shop</text>
    </g>

    <g id="Search_Bar">
      <rect x="400" y="16" width="640" height="48" rx="24" fill="#FFFFFF" filter="url(#shadow)" />
      
      <circle cx="430" cy="40" r="7" stroke="#64748B" stroke-width="2" fill="none" />
      <path d="M435 45 L441 51" stroke="#64748B" stroke-width="2" stroke-linecap="round" />
      
      <text x="460" y="46" font-family="Arial, sans-serif" font-size="15" fill="#94A3B8">Tìm kiếm quần áo...</text>
      
      <rect x="930" y="20" width="100" height="40" rx="20" fill="#2563EB" style="cursor: pointer;" />
      <text x="980" y="45" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Tìm kiếm</text>
    </g>

    <g id="Button_Login" style="cursor: pointer;">
      <circle cx="1230" cy="40" r="14" stroke="#0F172A" stroke-width="2" fill="none" />
      <circle cx="1230" cy="35" r="5" stroke="#0F172A" stroke-width="2" fill="none" />
      <path d="M1220.5 48.5 C1220.5 43.5 1239.5 43.5 1239.5 48.5" stroke="#0F172A" stroke-width="2" fill="none" stroke-linecap="round" />
      <text x="1255" y="47" font-family="Arial, sans-serif" font-size="20" font-weight="600" fill="#004085">Đăng nhập</text>
    </g>
  </g>

  <g id="Search_Page_Content">
    
    <g id="Sorting_And_Filters_Row">
      <text x="130" y="140" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#0F172A">Sắp xếp theo:</text>
      
      <g id="Sort_Popular" style="cursor: pointer;">
        <rect x="270" y="115" width="90" height="36" rx="18" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" />
        <text x="315" y="138" font-family="Arial, sans-serif" font-size="15" fill="#475569" text-anchor="middle">Nổi bật</text>
      </g>
      
      <g id="Sort_BestSeller" style="cursor: pointer;">
        <rect x="375" y="115" width="100" height="36" rx="18" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" />
        <text x="425" y="138" font-family="Arial, sans-serif" font-size="15" fill="#475569" text-anchor="middle">Bán chạy</text>
      </g>

      <g id="Sort_Newest" style="cursor: pointer;">
        <rect x="490" y="115" width="100" height="36" rx="18" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" />
        <text x="540" y="138" font-family="Arial, sans-serif" font-size="15" fill="#475569" text-anchor="middle">Mới nhất</text>
      </g>

      <g id="Sort_Price" style="cursor: pointer;">
        <rect x="605" y="115" width="80" height="36" rx="18" fill="#F1F5F9" />
        <text x="635" y="138" font-family="Arial, sans-serif" font-size="15" fill="#0F172A" text-anchor="middle">Giá</text>
        <path d="M652 138 L657 133 L662 138" stroke="#0F172A" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      </g>

      <g id="Button_Filter" style="cursor: pointer;">
        <rect x="1190" y="110" width="120" height="46" rx="23" fill="#FFFFFF" filter="url(#shadow)" />
        <path d="M1215 125 L1235 125 L1227 135 L1227 143 L1223 140 L1223 135 Z" stroke="#0F172A" stroke-width="1.5" fill="none" stroke-linejoin="round"/>
        <text x="1255" y="138" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#0F172A" text-anchor="middle">Lọc</text>
      </g>
    </g>

    <g id="Product_Row_1">
      <g id="Card_1">
        <rect x="130" y="180" width="280" height="360" rx="12" fill="#FCE7F3" />
        <text x="130" y="570" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#0F172A">399.000đ</text>
        <text x="130" y="600" font-family="Arial, sans-serif" font-size="15" fill="#475569">Áo Sơ-mi Ngắn Tay asymmetrical...</text>
      </g>
      
      <g id="Card_2">
        <rect x="430" y="180" width="280" height="360" rx="12" fill="#FFE4E6" />
        <text x="430" y="570" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#0F172A">449.000đ</text>
        <text x="430" y="600" font-family="Arial, sans-serif" font-size="15" fill="#475569">Áo Sơ-mi Ngắn Tay Raglan collection</text>
      </g>

      <g id="Card_3">
        <rect x="730" y="180" width="280" height="360" rx="12" fill="#FBCFE8" />
        <text x="730" y="570" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#0F172A">349.000đ</text>
        <text x="730" y="600" font-family="Arial, sans-serif" font-size="15" fill="#475569">Áo Không Tay Thêu Hoa Collection</text>
      </g>

      <g id="Card_4">
        <rect x="1030" y="180" width="280" height="360" rx="12" fill="#FCE7F3" />
        <text x="1030" y="570" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#0F172A">399.000đ</text>
        <text x="1030" y="600" font-family="Arial, sans-serif" font-size="15" fill="#475569">Áo Sơ-mi Ngắn Tay Relax Fit Collection</text>
      </g>
    </g>

    <g id="Product_Row_2">
      <rect x="130" y="640" width="280" height="360" rx="12" fill="#FBCFE8" />
      <rect x="430" y="640" width="280" height="360" rx="12" fill="#FFE4E6" />
      <rect x="730" y="640" width="280" height="360" rx="12" fill="#F1F5F9" />
      <rect x="1030" y="640" width="280" height="360" rx="12" fill="#E2E8F0" />
    </g>
  </g>

  <rect width="1440" height="1024" fill="#0F172A" opacity="0.6" />

  <g id="Popup_Register_Modal">
    <rect x="440" y="200" width="560" height="580" rx="24" fill="#FFFFFF" filter="url(#popupShadow)" />
    
    <g id="Close_Button" style="cursor: pointer;">
      <circle cx="960" cy="240" r="16" fill="#F1F5F9" />
      <path d="M954 234 L966 246 M966 234 L954 246" stroke="#64748B" stroke-width="2" stroke-linecap="round" />
    </g>
    
    <g id="Logo_Popup">
      <circle cx="625" cy="260" r="16" fill="#2563EB" />
      <circle cx="641" cy="260" r="16" fill="#60A5FA" opacity="0.8" />
      <text x="670" y="268" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#0F172A">Fashon Shop</text>
    </g>
    
    <text x="720" y="340" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#0F172A" text-anchor="middle">Đăng ký</text>
    <text x="720" y="380" font-family="Arial, sans-serif" font-size="16" fill="#475569" text-anchor="middle">Nhập tên và mật khẩu để đăng ký tài khoản mới</text>
    
    <g id="Input_DisplayName">
      <rect x="490" y="420" width="460" height="60" rx="30" fill="none" stroke="#CBD5E1" stroke-width="1.5" />
      <text x="520" y="456" font-family="Arial, sans-serif" font-size="16" fill="#94A3B8">Nhập tên hiển thị</text>
    </g>

    <g id="Input_Password">
      <rect x="490" y="500" width="460" height="60" rx="30" fill="none" stroke="#CBD5E1" stroke-width="1.5" />
      <text x="520" y="536" font-family="Arial, sans-serif" font-size="16" fill="#94A3B8">Nhập mật khẩu</text>
      <path d="M895 530 C903 522 917 522 925 530 C917 538 903 538 895 530 Z" fill="none" stroke="#94A3B8" stroke-width="2"/>
      <circle cx="910" cy="530" r="3" fill="#94A3B8"/>
    </g>

    <g id="Input_Confirm_Password">
      <rect x="490" y="580" width="460" height="60" rx="30" fill="none" stroke="#CBD5E1" stroke-width="1.5" />
      <text x="520" y="616" font-family="Arial, sans-serif" font-size="16" fill="#94A3B8">Xác nhận lại mật khẩu</text>
      <path d="M895 610 C903 602 917 602 925 610 C917 618 903 618 895 610 Z" fill="none" stroke="#94A3B8" stroke-width="2"/>
      <circle cx="910" cy="610" r="3" fill="#94A3B8"/>
    </g>

    <g id="Button_Register" style="cursor: pointer;">
      <rect x="490" y="660" width="460" height="60" rx="30" fill="#FFC83D" />
      <text x="680" y="696" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#0F172A" text-anchor="middle">Đăng ký</text>
      <path d="M760 684 L768 690 L760 696 M748 690 L767 690" stroke="#0F172A" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
</svg>