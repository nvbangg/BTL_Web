    <g id="Menu_Item_Cart" style="cursor: pointer;">
      <rect x="1160" y="80" width="160" height="40" rx="8" fill="#F8FAFC" />
      <path d="M1174 96 V93 C1174 89 1186 89 1186 93 V96 M1171 96 H1189 L1187 108 H1173 Z" stroke="#0F172A" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="1200" y="105" font-family="Arial, sans-serif" font-size="16" fill="#0F172A">Giỏ hàng</text>
    </g>
    
    <g id="Menu_Item_Orders" style="cursor: pointer;">
      <rect x="1160" y="120" width="160" height="40" rx="8" fill="none" />
      <path d="M1172 136 L1180 132 L1188 136 L1188 144 L1180 148 L1172 144 Z M1172 136 L1180 140 L1188 136 M1180 148 V140" stroke="#475569" stroke-width="1.5" fill="none" stroke-linejoin="round"/>
      <text x="1200" y="145" font-family="Arial, sans-serif" font-size="16" fill="#475569">Đơn hàng</text>
    </g>
    
    <g id="Menu_Item_Admin" style="cursor: pointer;">
      <rect x="1160" y="160" width="160" height="40" rx="8" fill="none" />
      <rect x="1173" y="173" width="5" height="5" rx="1" stroke="#475569" stroke-width="1.5" fill="none"/>
      <rect x="1182" y="173" width="5" height="5" rx="1" stroke="#475569" stroke-width="1.5" fill="none"/>
      <rect x="1173" y="182" width="5" height="5" rx="1" stroke="#475569" stroke-width="1.5" fill="none"/>
      <rect x="1182" y="182" width="5" height="5" rx="1" stroke="#475569" stroke-width="1.5" fill="none"/>
      <text x="1200" y="185" font-family="Arial, sans-serif" font-size="16" fill="#475569">Trang Admin</text>
    </g>

    <path d="M1150 205 L1330 205" stroke="#E2E8F0" stroke-width="1" />
    
    <g id="Menu_Item_Logout" style="cursor: pointer;">
      <rect x="1160" y="210" width="160" height="40" rx="8" fill="none" />
      <path d="M1181 223 H1175 V237 H1181 M1184 226 L1188 230 L1184 234 M1178 230 H1188" stroke="#EF4444" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="1200" y="235" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#EF4444">Đăng xuất</text>
