    <text x="130" y="915" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#F8FAFC">Fashon Shop</text>
    <text x="130" y="945" font-family="Arial, sans-serif" font-size="13" fill="#94A3B8">© 2026 Bản quyền thuộc về Fashon Shop.</text>
    <text x="130" y="970" font-family="Arial, sans-serif" font-size="13" fill="#94A3B8">Phát triển bởi: Nguyễn Văn Bằng</text>

    <text x="550" y="915" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#F8FAFC">Thông tin liên hệ</text>
    
    <path d="M555 941 C 555 937 559 937 559 937 C 559 937 563 937 563 941 C 563 944 559 947 559 947 C 559 947 555 944 555 941 Z" fill="#EF4444" opacity="0.9"/>
    <circle cx="559" cy="940" r="1.5" fill="#FFFFFF"/>
    <text x="570" y="945" font-family="Arial, sans-serif" font-size="13" fill="#94A3B8">Địa chỉ: Học viện Công nghệ Bưu chính Viễn thông, Hà Nội</text>
    
    <path d="M553 964 L555 964 A 2 2 0 0 1 557 966 L557 967 A 1 1 0 0 1 556 968 L555 968 C 556 970 558 972 560 973 L560 972 A 1 1 0 0 1 561 971 L562 971 A 2 2 0 0 1 564 973 L564 975 A 1 1 0 0 1 563 976 L561 976 A 8 8 0 0 1 553 968 Z" fill="#94A3B8"/>
    <text x="570" y="970" font-family="Arial, sans-serif" font-size="13" fill="#94A3B8">Điện thoại: 0987.654.321</text>
    
    <rect x="552" y="988" width="14" height="10" rx="1.5" fill="#E2E8F0" />
    <path d="M552 990 L559 994 L566 990" stroke="#94A3B8" stroke-width="1.2" fill="none"/>
    <text x="570" y="995" font-family="Arial, sans-serif" font-size="13" fill="#94A3B8">Email: contact@fashonshop.vn</text>

    <text x="1050" y="915" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#F8FAFC">Kết nối với chúng tôi</text>
    
    <g id="Social_Icons" transform="translate(1050, 940)">
      <rect x="0" y="0" width="40" height="40" rx="12" stroke="#475569" stroke-width="1.5" fill="none" />
      <path d="M22 15 h-2 a 2 2 0 0 0 -2 2 v2 h4 l-1 3 h-3 v7 h-3 v-7 h-2 v-3 h2 v-2 a 5 5 0 0 1 5 -5 h2 z" fill="#F8FAFC"/>
      
      <rect x="55" y="0" width="40" height="40" rx="12" stroke="#475569" stroke-width="1.5" fill="none" />
      <text x="75" y="24" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#F8FAFC" text-anchor="middle">Zalo</text>
      
      <rect x="110" y="0" width="40" height="40" rx="12" stroke="#475569" stroke-width="1.5" fill="none" />
      <path d="M120 16 a 6 6 0 0 1 12 0 c 0 3.3 -2.7 6 -6 6 h-2 l-3 3 v-3 a 5.8 5.8 0 0 1 -1 -6 z" stroke="#F8FAFC" stroke-width="1.5" fill="none"/>
      <circle cx="124" cy="16" r="1.5" fill="#F8FAFC"/>
      <circle cx="128" cy="16" r="1.5" fill="#F8FAFC"/>
      
      <rect x="165" y="0" width="40" height="40" rx="12" stroke="#475569" stroke-width="1.5" fill="none" />
      <path d="M182 12 v10 a 3 3 0 1 1 -3 -3 v3 a 1 1 0 1 0 1 1 v-11 h3 a 4 4 0 0 0 4 4 v-3 a 2 2 0 0 1 -2 -2 z" fill="#F8FAFC"/>
    </g>
  </g>

  <g id="User_Dropdown_Menu">
