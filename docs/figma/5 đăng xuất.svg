<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1024" width="1440" height="1024">
  <defs>
    <linearGradient id="heroGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="50%" stop-color="#EFF6FF" />
      <stop offset="100%" stop-color="#DBEAFE" />
    </linearGradient>
    
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#2563EB" flood-opacity="0.15"/>
    </filter>
  </defs>

  <g id="Background_Page">
    <rect width="1440" height="1024" fill="url(#heroGradient)" />
    <circle cx="150" cy="350" r="300" fill="#BFDBFE" opacity="0.4" />
    <circle cx="1300" cy="650" r="400" fill="#93C5FD" opacity="0.3" />
    <circle cx="850" cy="200" r="150" fill="#DBEAFE" opacity="0.6" />
  </g>

  <g id="Header">
    <rect width="1440" height="80" fill="none" />
    
    <g id="Logo_Header" style="cursor: pointer;">
      <circle cx="146" cy="40" r="16" fill="#2563EB" />
      <circle cx="162" cy="40" r="16" fill="#60A5FA" opacity="0.8" />
      <text x="190" y="48" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="#0F172A">Fashon Shop</text>
    </g>

    <g id="Search_Bar">
      <rect x="400" y="16" width="640" height="48" rx="24" fill="#FFFFFF" filter="url(#shadow)" />
      
      <circle cx="430" cy="40" r="7" stroke="#64748B" stroke-width="2" fill="none" />
      <path d="M435 45 L441 51" stroke="#64748B" stroke-width="2" stroke-linecap="round" />
      
      <text x="460" y="46" font-family="Arial, sans-serif" font-size="15" fill="#94A3B8">Tìm kiếm quần áo...</text>
      
      <rect x="930" y="20" width="100" height="40" rx="20" fill="#2563EB" style="cursor: pointer;" />
      <text x="980" y="45" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Tìm kiếm</text>
    </g>

    <g id="User_Profile" style="cursor: pointer;">
      <circle cx="1190" cy="40" r="18" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5" />
      <circle cx="1190" cy="35" r="6" stroke="#94A3B8" stroke-width="1.5" fill="none" />
      <path d="M1178 48 C1178 41 1202 41 1202 48" stroke="#94A3B8" stroke-width="1.5" fill="none" />
      
      <text x="1220" y="46" font-family="Arial, sans-serif" font-size="18" font-weight="600" fill="#0F172A">nvbangg</text>
      
      <path d="M1305 44 L1312 37 L1319 44" stroke="#0F172A" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    </g>
  </g>

  <g id="Search_Page_Content">
    <g id="Product_Row_1">
      <g id="Card_1">
        <rect x="130" y="140" width="280" height="360" rx="12" fill="#FCE7F3" />
        <text x="130" y="530" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#0F172A">399.000đ</text>
        <text x="130" y="560" font-family="Arial, sans-serif" font-size="15" fill="#475569">Áo Sơ-mi Ngắn Tay asymmetrical...</text>
      </g>
      
      <g id="Card_2">
        <rect x="430" y="140" width="280" height="360" rx="12" fill="#FFE4E6" />
        <text x="430" y="530" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#0F172A">449.000đ</text>
        <text x="430" y="560" font-family="Arial, sans-serif" font-size="15" fill="#475569">Áo Sơ-mi Ngắn Tay Raglan collection</text>
      </g>

      <g id="Card_3">
        <rect x="730" y="140" width="280" height="360" rx="12" fill="#FBCFE8" />
        <text x="730" y="530" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#0F172A">349.000đ</text>
        <text x="730" y="560" font-family="Arial, sans-serif" font-size="15" fill="#475569">Áo Không Tay Thêu Hoa Collection</text>
      </g>

      <g id="Card_4">
        <rect x="1030" y="140" width="280" height="360" rx="12" fill="#FCE7F3" />
        <text x="1030" y="530" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#0F172A">399.000đ</text>
        <text x="1030" y="560" font-family="Arial, sans-serif" font-size="15" fill="#475569">Áo Sơ-mi Ngắn Tay Relax Fit Collection</text>
      </g>
    </g>
  </g>

  <g id="Pagination">
    <circle cx="525" cy="620" r="18" fill="#FFFFFF" />
    <path d="M528 614 L522 620 L528 626" stroke="#64748B" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="575" cy="620" r="18" fill="#2563EB" />
    <text x="575" y="625" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
    <circle cx="625" cy="620" r="18" fill="#FFFFFF" />
    <text x="625" y="625" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#475569" text-anchor="middle">2</text>
    <circle cx="675" cy="620" r="18" fill="#FFFFFF" />
    <text x="675" y="625" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#475569" text-anchor="middle">3</text>
    <text x="725" y="625" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#94A3B8" text-anchor="middle">...</text>
    <circle cx="775" cy="620" r="18" fill="#FFFFFF" />
    <text x="775" y="625" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#475569" text-anchor="middle">10</text>
    <circle cx="825" cy="620" r="18" fill="#FFFFFF" />
    <path d="M822 614 L828 620 L822 626" stroke="#64748B" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g id="Why_Choose_Us">
    <rect x="250" y="670" width="940" height="170" rx="20" fill="#FFFFFF" fill-opacity="0.6" />
    <text x="720" y="705" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#0F172A" text-anchor="middle">Tại sao chọn Fashon Shop?</text>
    
    <text x="720" y="730" font-family="Arial, sans-serif" font-size="13" fill="#475569" text-anchor="middle">Fashon Shop cam kết mang đến những bộ sưu tập thời trang cao cấp từ các thương hiệu nổi tiếng.</text>
    <text x="720" y="750" font-family="Arial, sans-serif" font-size="13" fill="#475569" text-anchor="middle">Mỗi sản phẩm được lựa chọn kỹ lưỡng, đảm bảo cả về chất liệu, thiết kế, mang lại cho bạn sự sang trọng.</text>
    <text x="720" y="770" font-family="Arial, sans-serif" font-size="13" fill="#475569" text-anchor="middle">Hãy cùng khám phá và định hình phong cách cá nhân đẳng cấp nhất của riêng bạn tại Fashon Shop.</text>

    <g id="Feature_1">
       <circle cx="390" cy="805" r="18" fill="#DBEAFE" />
       <path d="M382 799 h8 v9 h-8 z M390 802 h4 l2 3 v4 h-6 z" stroke="#2563EB" stroke-width="1.5" fill="none"/>
       <circle cx="385" cy="809" r="1.5" fill="#2563EB"/>
       <circle cx="393" cy="809" r="1.5" fill="#2563EB"/>
       
       <text x="420" y="800" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#0F172A">Giao hàng toàn quốc</text>
       <text x="420" y="818" font-family="Arial, sans-serif" font-size="12" fill="#64748B">Miễn phí cho đơn từ 500k</text>
    </g>

    <g id="Feature_2">
       <circle cx="650" cy="805" r="18" fill="#DBEAFE" />
       <path d="M642 798 L650 795 L658 798 V804 C658 809 650 813 650 813 C650 813 642 809 642 804 Z" stroke="#2563EB" stroke-width="1.5" fill="none"/>
       <path d="M647 805 L649 807 L654 801" stroke="#2563EB" stroke-width="1.5" fill="none"/>

       <text x="680" y="800" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#0F172A">Chất lượng đảm bảo</text>
       <text x="680" y="818" font-family="Arial, sans-serif" font-size="12" fill="#64748B">Sản phẩm giống 100% mô tả</text>
    </g>

    <g id="Feature_3">
       <circle cx="910" cy="805" r="18" fill="#DBEAFE" />
       <path d="M905 803 A 5 5 0 1 1 908 809" stroke="#2563EB" stroke-width="1.5" fill="none" />
       <path d="M904 800 V804 H908" stroke="#2563EB" stroke-width="1.5" fill="none" />
       
       <text x="940" y="800" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#0F172A">Đổi trả dễ dàng</text>
       <text x="940" y="818" font-family="Arial, sans-serif" font-size="12" fill="#64748B">Hỗ trợ đổi size trong 7 ngày</text>
    </g>
  </g>

  <g id="Footer">
