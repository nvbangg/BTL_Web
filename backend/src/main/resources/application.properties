spring.application.name=fashonshop
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.mvc.static-path-pattern=/assets/**
spring.web.resources.static-locations=classpath:/static/,file:./uploads/
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=25MB
spring.web.cors.allowed-origin-patterns=*
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,PATCH,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=false
app.jwt.secret=${JWT_SECRET:replace-this-with-a-long-secret-key-at-least-32-chars}
app.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:604800}
app.upload.product-images-dir=${PRODUCT_IMAGES_DIR:src/main/resources/static/images}
app.upload.max-image-size-bytes=${PRODUCT_IMAGE_MAX_SIZE_BYTES:5242880}