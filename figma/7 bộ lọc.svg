<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1024" width="1440" height="1024">
  <defs>
    <linearGradient id="heroGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="50%" stop-color="#EFF6FF" />
      <stop offset="100%" stop-color="#DBEAFE" />
    </linearGradient>
    
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#2563EB" flood-opacity="0.15"/>
    </filter>
    <filter id="panelShadow" x="-10%" y="0%" width="120%" height="100%">
      <feDropShadow dx="-8" dy="0" stdDeviation="15" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <g id="Background_Page">
    <rect width="1440" height="1024" fill="url(#heroGradient)" />
    <circle cx="150" cy="350" r="300" fill="#BFDBFE" opacity="0.4" />
    <circle cx="1300" cy="650" r="400" fill="#93C5FD" opacity="0.3" />
    <circle cx="850" cy="200" r="150" fill="#DBEAFE" opacity="0.6" />
  </g>

  <g id="Header">
    <rect width="1440" height="80" fill="none" />
    
    <g id="Logo_Header" style="cursor: pointer;">
      <circle cx="80" cy="40" r="16" fill="#2563EB" />
      <circle cx="96" cy="40" r="16" fill="#60A5FA" opacity="0.8" />
      <text x="125" y="48" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="#0F172A">Fashon Shop</text>
    </g>

    <g id="User_Profile" style="cursor: pointer;">
      <circle cx="1190" cy="40" r="18" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5" />
      <circle cx="1190" cy="35" r="6" stroke="#94A3B8" stroke-width="1.5" fill="none" />
      <path d="M1178 48 C1178 41 1202 41 1202 48" stroke="#94A3B8" stroke-width="1.5" fill="none" />
      
      <text x="1220" y="46" font-family="Arial, sans-serif" font-size="18" font-weight="600" fill="#0F172A">nvbangg</text>
      
      <path d="M1305 37 L1312 44 L1319 37" stroke="#0F172A" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    </g>
  </g>

  <g id="Search_Page_Content">
    
    <g id="Search_And_Filters_Row">
      <rect x="130" y="140" width="1040" height="60" rx="30" fill="#FFFFFF" filter="url(#shadow)" />
      <circle cx="170" cy="170" r="8" stroke="#64748B" stroke-width="2" fill="none" />
      <path d="M176 176 L182 182" stroke="#64748B" stroke-width="2" stroke-linecap="round" />
      <text x="200" y="176" font-family="Arial, sans-serif" font-size="16" fill="#94A3B8">Tìm kiếm quần áo</text>
      
      <rect x="1040" y="146" width="120" height="48" rx="24" fill="#2563EB" style="cursor: pointer;" />
      <text x="1100" y="175" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Tìm kiếm</text>

      <g id="Button_Filter" style="cursor: pointer;">
        <rect x="1190" y="140" width="120" height="60" rx="30" fill="#E2E8F0" />
        <path d="M1215 162 L1235 162 L1227 172 L1227 180 L1223 177 L1223 172 Z" stroke="#0F172A" stroke-width="1.5" fill="none" stroke-linejoin="round"/>
        <text x="1245" y="176" font-family="Arial, sans-serif" font-size="18" font-weight="600" fill="#0F172A">Lọc</text>
      </g>
    </g>

    <g id="Sorting_Row">
      <text x="130" y="260" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#0F172A">Sắp xếp theo:</text>
      
      <g id="Sort_Popular" style="cursor: pointer;">
        <rect x="270" y="235" width="90" height="36" rx="18" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" />
        <text x="315" y="258" font-family="Arial, sans-serif" font-size="15" fill="#475569" text-anchor="middle">Nổi bật</text>
      </g>
      
      <g id="Sort_BestSeller" style="cursor: pointer;">
        <rect x="375" y="235" width="100" height="36" rx="18" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" />
        <text x="425" y="258" font-family="Arial, sans-serif" font-size="15" fill="#475569" text-anchor="middle">Bán chạy</text>
      </g>

      <g id="Sort_Newest" style="cursor: pointer;">
        <rect x="490" y="235" width="100" height="36" rx="18" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" />
        <text x="540" y="258" font-family="Arial, sans-serif" font-size="15" fill="#475569" text-anchor="middle">Mới nhất</text>
      </g>

      <g id="Sort_Price" style="cursor: pointer;">
        <rect x="605" y="235" width="80" height="36" rx="18" fill="#F1F5F9" />
        <text x="635" y="258" font-family="Arial, sans-serif" font-size="15" fill="#0F172A" text-anchor="middle">Giá</text>
        <path d="M652 258 L657 253 L662 258" stroke="#0F172A" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
    </g>

    <g id="Product_Row_1">
      <g id="Card_1">
        <rect x="130" y="300" width="280" height="360" rx="12" fill="#FCE7F3" />
        <text x="130" y="690" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#0F172A">399.000đ</text>
        <text x="130" y="720" font-family="Arial, sans-serif" font-size="15" fill="#475569">Áo Sơ-mi Ngắn Tay asymmetrical...</text>
      </g>
      
      <g id="Card_2">
        <rect x="430" y="300" width="280" height="360" rx="12" fill="#FFE4E6" />
        <text x="430" y="690" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#0F172A">449.000đ</text>
        <text x="430" y="720" font-family="Arial, sans-serif" font-size="15" fill="#475569">Áo Sơ-mi Ngắn Tay Raglan collection</text>
      </g>

      <g id="Card_3">
        <rect x="730" y="300" width="280" height="360" rx="12" fill="#FBCFE8" />
        <text x="730" y="690" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#0F172A">349.000đ</text>
        <text x="730" y="720" font-family="Arial, sans-serif" font-size="15" fill="#475569">Áo Không Tay Thêu Hoa Collection</text>
      </g>

      <g id="Card_4">
        <rect x="1030" y="300" width="280" height="360" rx="12" fill="#FCE7F3" />
        <text x="1030" y="690" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#0F172A">399.000đ</text>
        <text x="1030" y="720" font-family="Arial, sans-serif" font-size="15" fill="#475569">Áo Sơ-mi Ngắn Tay Relax Fit Collection</text>
      </g>
    </g>

    <g id="Product_Row_2">
      <rect x="130" y="760" width="280" height="360" rx="12" fill="#FBCFE8" />
      <rect x="430" y="760" width="280" height="360" rx="12" fill="#FFE4E6" />
      <rect x="730" y="760" width="280" height="360" rx="12" fill="#F1F5F9" />
      <rect x="1030" y="760" width="280" height="360" rx="12" fill="#E2E8F0" />
    </g>
  </g>

  <g id="Filter_Panel">
    <rect x="960" y="0" width="480" height="1024" fill="#FFFFFF" filter="url(#panelShadow)" />
    
    <path d="M1430 85 L1434 80 L1438 85" fill="#64748B"/>
    <rect x="1430" y="95" width="8" height="700" rx="4" fill="#94A3B8" />
    <path d="M1430 805 L1434 810 L1438 805" fill="#64748B"/>

    <text x="1000" y="55" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#0F172A">Bộ lọc</text>
    <g id="Button_Close_Filter" style="cursor: pointer;">
      <circle cx="1380" cy="48" r="18" fill="none" stroke="#CBD5E1" stroke-width="1.5" />
      <path d="M1373 41 L1387 55 M1387 41 L1373 55" stroke="#64748B" stroke-width="1.5" stroke-linecap="round" />
    </g>
    <line x1="960" y1="80" x2="1440" y2="80" stroke="#E2E8F0" stroke-width="1" />

    <g id="Filter_Scroll_Content" transform="translate(0, 110)">
      
      <g id="Section_Category">
        <text x="1000" y="0" font-family="Arial, sans-serif" font-size="18" fill="#1E293B">Danh mục</text>
        <path d="M1370 -5 L1386 -5" stroke="#94A3B8" stroke-width="1.5" /> <rect x="1000" y="25" width="20" height="20" rx="4" fill="none" stroke="#CBD5E1" stroke-width="1.5" />
        <text x="1035" y="41" font-family="Arial, sans-serif" font-size="16" fill="#0F172A">Áo sơ mi</text>
        
        <rect x="1200" y="25" width="20" height="20" rx="4" fill="none" stroke="#CBD5E1" stroke-width="1.5" />
        <text x="1235" y="41" font-family="Arial, sans-serif" font-size="16" fill="#0F172A">Áo thun</text>

        <rect x="1000" y="65" width="20" height="20" rx="4" fill="none" stroke="#CBD5E1" stroke-width="1.5" />
        <text x="1035" y="81" font-family="Arial, sans-serif" font-size="16" fill="#0F172A">Quần dài</text>
        
        <line x1="1000" y1="110" x2="1390" y2="110" stroke="#F1F5F9" stroke-width="2" stroke-dasharray="4 4" />
      </g>

      <g id="Section_Gender" transform="translate(0, 150)">
        <text x="1000" y="0" font-family="Arial, sans-serif" font-size="18" fill="#1E293B">Giới tính</text>
        <path d="M1370 -5 L1386 -5" stroke="#94A3B8" stroke-width="1.5" />
        
        <rect x="1000" y="25" width="20" height="20" rx="4" fill="none" stroke="#CBD5E1" stroke-width="1.5" />
        <text x="1035" y="41" font-family="Arial, sans-serif" font-size="16" fill="#0F172A">Nam</text>
        
        <rect x="1000" y="65" width="20" height="20" rx="4" fill="none" stroke="#CBD5E1" stroke-width="1.5" />
        <text x="1035" y="81" font-family="Arial, sans-serif" font-size="16" fill="#0F172A">Nữ</text>

        <rect x="1000" y="105" width="20" height="20" rx="4" fill="none" stroke="#CBD5E1" stroke-width="1.5" />
        <text x="1035" y="121" font-family="Arial, sans-serif" font-size="16" fill="#0F172A">Unisex</text>

        <line x1="1000" y1="150" x2="1390" y2="150" stroke="#F1F5F9" stroke-width="2" stroke-dasharray="4 4" />
      </g>

      <g id="Section_Price" transform="translate(0, 360)">
        <text x="1000" y="0" font-family="Arial, sans-serif" font-size="18" fill="#1E293B">Giá</text>
        <path d="M1370 -5 L1386 -5" stroke="#94A3B8" stroke-width="1.5" />
        
        <rect x="1000" y="25" width="20" height="20" rx="4" fill="none" stroke="#CBD5E1" stroke-width="1.5" />
        <text x="1035" y="41" font-family="Arial, sans-serif" font-size="16" fill="#0F172A">Dưới 99.000đ</text>
        
        <rect x="1200" y="25" width="20" height="20" rx="4" fill="none" stroke="#CBD5E1" stroke-width="1.5" />
        <text x="1235" y="41" font-family="Arial, sans-serif" font-size="16" fill="#0F172A">100.000đ - 199.000đ</text>

        <rect x="1000" y="70" width="20" height="20" rx="4" fill="none" stroke="#CBD5E1" stroke-width="1.5" />
        <text x="1035" y="86" font-family="Arial, sans-serif" font-size="16" fill="#0F172A">200.000đ - 299.000đ</text>
        
        <rect x="1200" y="70" width="20" height="20" rx="4" fill="none" stroke="#CBD5E1" stroke-width="1.5" />
        <text x="1235" y="86" font-family="Arial, sans-serif" font-size="16" fill="#0F172A">300.000đ - 499.000đ</text>

        <rect x="1000" y="115" width="20" height="20" rx="4" fill="none" stroke="#CBD5E1" stroke-width="1.5" />
        <text x="1035" y="125" font-family="Arial, sans-serif" font-size="16" fill="#0F172A">500.000đ - </text>
        <text x="1035" y="147" font-family="Arial, sans-serif" font-size="16" fill="#0F172A">1.000.000đ</text>
        
        <rect x="1200" y="115" width="20" height="20" rx="4" fill="none" stroke="#CBD5E1" stroke-width="1.5" />
        <text x="1235" y="131" font-family="Arial, sans-serif" font-size="16" fill="#0F172A">Trên 1.000.000đ</text>

        <line x1="1000" y1="180" x2="1390" y2="180" stroke="#F1F5F9" stroke-width="2" stroke-dasharray="4 4" />
      </g>

      <g id="Section_Size" transform="translate(0, 580)">
        <text x="1000" y="0" font-family="Arial, sans-serif" font-size="18" fill="#1E293B">Size</text>
        <path d="M1370 -5 L1386 -5" stroke="#94A3B8" stroke-width="1.5" />
        
        <circle cx="1025" cy="40" r="24" fill="none" stroke="#CBD5E1" stroke-width="1" />
        <text x="1025" y="45" font-family="Arial, sans-serif" font-size="14" fill="#0F172A" text-anchor="middle">S</text>
        
        <circle cx="1085" cy="40" r="24" fill="none" stroke="#CBD5E1" stroke-width="1" />
        <text x="1085" y="45" font-family="Arial, sans-serif" font-size="14" fill="#0F172A" text-anchor="middle">M</text>

        <circle cx="1145" cy="40" r="24" fill="none" stroke="#CBD5E1" stroke-width="1" />
        <text x="1145" y="45" font-family="Arial, sans-serif" font-size="14" fill="#0F172A" text-anchor="middle">L</text>

        <circle cx="1205" cy="40" r="24" fill="none" stroke="#CBD5E1" stroke-width="1" />
        <text x="1205" y="45" font-family="Arial, sans-serif" font-size="14" fill="#0F172A" text-anchor="middle">XL</text>

        <circle cx="1265" cy="40" r="24" fill="none" stroke="#CBD5E1" stroke-width="1" />
        <text x="1265" y="45" font-family="Arial, sans-serif" font-size="14" fill="#0F172A" text-anchor="middle">2XL</text>

        <circle cx="1325" cy="40" r="24" fill="none" stroke="#CBD5E1" stroke-width="1" />
        <text x="1325" y="45" font-family="Arial, sans-serif" font-size="14" fill="#0F172A" text-anchor="middle">3XL</text>

        <circle cx="1025" cy="100" r="24" fill="none" stroke="#CBD5E1" stroke-width="1" />
        <text x="1025" y="105" font-family="Arial, sans-serif" font-size="14" fill="#0F172A" text-anchor="middle">4XL</text>
        
        <circle cx="1085" cy="100" r="24" fill="none" stroke="#CBD5E1" stroke-width="1" />
        <text x="1085" y="105" font-family="Arial, sans-serif" font-size="14" fill="#0F172A" text-anchor="middle">28</text>

        <circle cx="1145" cy="100" r="24" fill="none" stroke="#CBD5E1" stroke-width="1" />
        <text x="1145" y="105" font-family="Arial, sans-serif" font-size="14" fill="#0F172A" text-anchor="middle">29</text>

        <circle cx="1205" cy="100" r="24" fill="none" stroke="#CBD5E1" stroke-width="1" />
        <text x="1205" y="105" font-family="Arial, sans-serif" font-size="14" fill="#0F172A" text-anchor="middle">30</text>

        <circle cx="1265" cy="100" r="24" fill="none" stroke="#CBD5E1" stroke-width="1" />
        <text x="1265" y="105" font-family="Arial, sans-serif" font-size="14" fill="#0F172A" text-anchor="middle">31</text>

        <circle cx="1325" cy="100" r="24" fill="none" stroke="#CBD5E1" stroke-width="1" />
        <text x="1325" y="105" font-family="Arial, sans-serif" font-size="14" fill="#0F172A" text-anchor="middle">32</text>
      </g>
    </g>

    <g id="Filter_Footer">
      <line x1="960" y1="910" x2="1440" y2="910" stroke="#E2E8F0" stroke-width="1" />
      <rect x="960" y="911" width="480" height="113" fill="#FFFFFF" />
      
      <rect x="1000" y="935" width="110" height="54" rx="27" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" style="cursor: pointer;" />
      <text x="1055" y="967" font-family="Arial, sans-serif" font-size="16" fill="#0F172A" text-anchor="middle">Xóa lọc</text>

      <rect x="1130" y="935" width="260" height="54" rx="27" fill="#FBBF24" style="cursor: pointer;" />
      <text x="1260" y="967" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#0F172A" text-anchor="middle">Áp dụng</text>
    </g>
  </g>

</svg>