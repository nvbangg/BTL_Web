<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chi tiet san pham - Fashon Shop</title>
    <link rel="stylesheet" href="./css/app.css" />
  </head>
  <body data-base-path="./">
    <div class="page-wrap">
      <header class="public-header">
        <a class="brand" href="./index.html">
          <img src="./assets/logo.svg" alt="logo" />
          <span>Fashon Shop</span>
        </a>

        <form class="search-form" id="search-form">
          <input id="search-input" type="text" placeholder="Tim kiem quan ao..." />
          <button class="btn btn-primary" type="submit">Tim kiem</button>
        </form>

        <div class="account-wrap">
          <button id="account-trigger" class="account-trigger">Dang nhap</button>
          <div id="account-menu" class="account-menu hidden"></div>
        </div>
      </header>

      <main>
        <div class="detail-layout">
          <section class="detail-gallery">
            <img id="detail-main-image" class="detail-main-image" src="./assets/background.png" alt="product" />
            <div id="detail-thumbs" class="detail-thumbs"></div>
          </section>

          <section class="detail-panel">
            <h1 id="detail-name" style="margin-top: 0">San pham</h1>
            <p id="detail-price" class="product-price">0đ</p>
            <p id="detail-sold" style="margin: -6px 0 10px; color: #73829f">Da ban: 0</p>

            <div class="option-group">
              <h4>Mo ta</h4>
              <p id="detail-description" style="margin: 0; color: #4f5d79">Dang tai...</p>
            </div>

            <div class="option-group">
              <h4>Mau sac</h4>
              <div id="detail-color-options" class="option-list"></div>
            </div>

            <div class="option-group">
              <h4>Size</h4>
              <div id="detail-size-options" class="option-list"></div>
            </div>

            <div class="option-group inline-controls">
              <h4 style="margin: 0">So luong</h4>
              <div class="qty-control">
                <button id="qty-minus" type="button">-</button>
                <input id="qty-input" type="number" min="1" value="1" />
                <button id="qty-plus" type="button">+</button>
              </div>
              <span id="variant-stock" style="color: #6a7892">Ton kho: -</span>
            </div>

            <div class="option-group">
              <button id="add-to-cart-btn" class="btn btn-accent btn-block" type="button">Them vao gio hang</button>
            </div>
          </section>
        </div>
      </main>
    </div>

    <script type="module" src="./js/pages/product-detail.js"></script>
  </body>
</html>
