<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quản lý sản phẩm - Fashon Shop</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>
  <div id="app-header"></div>

  <div class="page-body">
    <div class="admin-layout">
      <div id="app-admin-sidebar"></div>

      <main class="admin-main">
        <h1>Quản lý sản phẩm</h1>

        <div class="admin-stats-row" id="product-stats"></div>

        <section class="admin-card">
          <div class="admin-card-header">
            <h3>Danh sách sản phẩm</h3>
            <div class="admin-card-tools">
              <div class="product-search-pill">
                <i class="bi bi-search product-search-icon"></i>
                <input id="product-search" placeholder="Tìm kiếm sản phẩm...">
              </div>
              <button class="sort-chip filter-chip" id="btn-open-admin-filter" type="button"><i class="bi bi-funnel"></i><span>Lọc</span></button>
              <button class="btn-add-product" id="btn-add-product" type="button"><i class="bi bi-plus-lg"></i><span>Thêm sản phẩm</span></button>
            </div>
          </div>

          <div class="product-sort-row">
            <span class="sort-row-label">Sắp xếp theo:</span>
            <button class="sort-chip" type="button" data-sort="best_selling">Bán chạy nhất</button>
            <button class="sort-chip" type="button" data-sort="newest">Mới nhất</button>
            <button class="sort-chip" type="button" data-sort="price_asc">Giá tăng</button>
            <button class="sort-chip" type="button" data-sort="price_desc">Giá giảm</button>
          </div>

          <div class="table-wrap">
            <table class="data-table">
              <thead>
                <tr>
                  <th>Sản phẩm</th>
                  <th>Giá bán</th>
                  <th>Đã bán</th>
                  <th>Tồn kho</th>
                  <th>Thao tác</th>
                </tr>
              </thead>
              <tbody id="products-tbody"></tbody>
            </table>
          </div>
          <div id="products-pagination"></div>
        </section>
      </main>
    </div>
  </div>

  <div class="filter-overlay" id="filter-overlay"></div>
  <aside class="filter-panel" id="admin-filter-panel">
    <div class="filter-header">
      <h3>Bộ lọc</h3>
      <button class="filter-close" id="admin-filter-close" type="button"><i class="bi bi-x-lg"></i></button>
    </div>
    <div class="filter-body">
      <div class="filter-group">
        <label class="filter-group-title" for="admin-filter-category">Danh mục</label>
        <select class="admin-filter-select" id="admin-filter-category" style="width:100%;height:42px"></select>
      </div>
      <div class="filter-group">
        <label class="filter-group-title" for="admin-filter-gender">Giới tính</label>
        <select class="admin-filter-select" id="admin-filter-gender" style="width:100%;height:42px"></select>
      </div>
      <div class="filter-group">
        <label class="filter-group-title" for="admin-filter-color">Màu sắc</label>
        <select class="admin-filter-select" id="admin-filter-color" style="width:100%;height:42px"></select>
      </div>
      <div class="filter-group">
        <label class="filter-group-title" for="admin-filter-size">Size</label>
        <select class="admin-filter-select" id="admin-filter-size" style="width:100%;height:42px"></select>
      </div>
      <div class="filter-group">
        <label class="filter-group-title">Giá tiền</label>
        <div class="form-row">
          <input class="form-input" id="admin-filter-min-price" type="number" min="0" placeholder="Giá tối thiểu">
          <input class="form-input" id="admin-filter-max-price" type="number" min="0" placeholder="Giá tối đa">
        </div>
      </div>
      <div class="filter-group">
        <label class="filter-group-title" for="admin-filter-is-active">Trạng thái hiển thị</label>
        <select class="admin-filter-select" id="admin-filter-is-active" style="width:100%;height:42px">
          <option value="">Tất cả</option>
          <option value="true">Đang bán</option>
          <option value="false">Tạm ẩn</option>
        </select>
      </div>
    </div>
    <div class="filter-actions">
      <button class="btn btn-ghost" id="admin-filter-reset" type="button">Xóa lọc</button>
      <button class="btn btn-yellow" id="admin-filter-apply" type="button">Áp dụng</button>
    </div>
  </aside>

  <div class="modal-overlay" id="edit-product-modal">
    <div class="modal" style="width:860px;max-height:90vh;overflow-y:auto">
      <div class="modal-header">
        <h3 id="edit-product-title">Chỉnh sửa sản phẩm</h3>
        <button class="filter-close" id="edit-product-close" type="button"><i class="bi bi-x-lg"></i></button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label for="modal-name">Tên sản phẩm *</label>
          <input class="form-input" id="modal-name" placeholder="Nhập tên sản phẩm">
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="modal-category">Danh mục *</label>
            <input class="form-input" id="modal-category" list="modal-category-list" placeholder="Nhập hoặc chọn danh mục">
            <datalist id="modal-category-list"></datalist>
          </div>
          <div class="form-group">
            <label for="modal-gender">Giới tính *</label>
            <select class="admin-filter-select" id="modal-gender" style="width:100%;height:42px">
              <option value="male">Nam</option>
              <option value="female">Nữ</option>
              <option value="unisex">Unisex</option>
            </select>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="modal-price">Giá bán cơ bản (VND) *</label>
            <input class="form-input" id="modal-price" type="number" min="1" placeholder="Nhập giá">
          </div>
          <div class="form-group">
            <label for="modal-is-active">Trạng thái hiển thị</label>
            <div class="toggle-field">
              <label class="toggle-switch">
                <input id="modal-is-active" type="checkbox" checked>
                <span class="toggle-slider"></span>
              </label>
              <span class="toggle-label">Đang bật</span>
            </div>
          </div>
        </div>

        <div class="form-group">
          <label for="modal-thumbnail">Thumbnail (tên file ảnh) *</label>
          <input class="form-input" id="modal-thumbnail" placeholder="VD: ao-nam1.1.png">
        </div>

        <div class="form-group">
          <label for="modal-description">Mô tả sản phẩm</label>
          <textarea class="form-textarea" id="modal-description" placeholder="Nhập mô tả"></textarea>
        </div>

        <div class="form-group">
          <label>Hình ảnh (ảnh đầu tiên là thumbnail)</label>
          <div id="modal-image-rows"></div>
          <button class="btn btn-outline" id="modal-add-image" type="button" style="margin-top:10px"><i class="bi bi-plus-lg"></i><span>Thêm ảnh</span></button>
        </div>

        <div class="form-group">
          <label>Phân loại sản phẩm</label>
          <table class="edit-variant-table">
            <thead>
              <tr>
                <th>Màu sắc</th>
                <th>Size</th>
                <th>Tồn kho</th>
                <th>Giá tùy chỉnh</th>
              </tr>
            </thead>
            <tbody id="modal-variant-rows"></tbody>
          </table>
          <button class="btn btn-outline" id="modal-add-variant" type="button" style="margin-top:10px"><i class="bi bi-plus-lg"></i><span>Thêm phân loại</span></button>
        </div>

        <div class="edit-form-divider"></div>
        <div style="display:flex;justify-content:flex-end;gap:10px">
          <button class="btn-cancel" id="modal-cancel-product" type="button" onclick="document.getElementById('edit-product-modal').classList.remove('show')">Hủy</button>
          <button class="btn-save" id="modal-save-product" type="button">Lưu thay đổi</button>
        </div>
      </div>
    </div>
  </div>

  <div id="app-auth"></div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/common.js"></script>
  <script src="js/admin-products.js"></script>
</body>
</html>
