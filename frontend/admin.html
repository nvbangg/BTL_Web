<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thống kê - Fashon Shop</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>
  <div id="app-header"></div>

  <div class="page-body">
    <div class="admin-layout">
      <div id="app-admin-sidebar"></div>

      <main class="admin-main">
        <h1>Tổng quan thống kê</h1>

        <div class="admin-stats-row" id="stats-grid"></div>

        <section class="admin-card">
          <div class="admin-card-header">
            <h3>Biểu đồ doanh thu</h3>
            <div style="display: flex; gap: 8px;">
              <select class="admin-filter-select" id="chart-year"></select>
              <select class="admin-filter-select" id="chart-month">
                <option value="">Cả năm</option>
                <option value="1">Tháng 1</option>
                <option value="2">Tháng 2</option>
                <option value="3">Tháng 3</option>
                <option value="4">Tháng 4</option>
                <option value="5">Tháng 5</option>
                <option value="6">Tháng 6</option>
                <option value="7">Tháng 7</option>
                <option value="8">Tháng 8</option>
                <option value="9">Tháng 9</option>
                <option value="10">Tháng 10</option>
                <option value="11">Tháng 11</option>
                <option value="12">Tháng 12</option>
              </select>
            </div>
          </div>
          <div style="height:340px;padding:12px 20px 24px">
            <canvas id="revenue-chart"></canvas>
          </div>
        </section>

        <section class="admin-card" style="margin-top: 24px;">
          <div class="admin-card-header">
            <h3>Danh sách đơn hàng đã giao</h3>
          </div>
          <div class="table-wrap">
            <table class="data-table">
              <thead>
                <tr>
                  <th>Mã đơn hàng</th>
                  <th>Ngày đặt</th>
                  <th>Ngày cập nhật</th>
                  <th>Tổng tiền</th>
                </tr>
              </thead>
              <tbody id="delivered-orders-list">
                <tr>
                  <td colspan="4" style="text-align: center; color: #64748b; padding: 20px;">Không có dữ liệu</td>
                </tr>
              </tbody>
            </table>
          </div>
        </section>
      </main>
    </div>
  </div>

  <div id="app-auth"></div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/common.js"></script>
  <script src="js/admin-stats.js"></script>
</body>
</html>
