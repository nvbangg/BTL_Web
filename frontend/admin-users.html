<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quản lý người dùng - Fashon Shop</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>
  <div id="app-header"></div>

  <div class="page-body">
    <div class="admin-layout">
      <div id="app-admin-sidebar"></div>

      <main class="admin-main">
        <h1>Quản lý người dùng</h1>

        <div class="admin-stats-row" id="user-stats"></div>

        <section class="admin-card">
          <div class="admin-card-header">
            <h3>Danh sách người dùng</h3>
            <div class="admin-card-tools">
              <div class="admin-search-pill">
                <i class="bi bi-search"></i>
                <input id="user-search" placeholder="Tìm tên, email, SĐT...">
              </div>
              <select class="admin-filter-select" id="user-role-filter">
                <option value="">Tất cả vai trò</option>
                <option value="user">user</option>
                <option value="admin">admin</option>
              </select>
            </div>
          </div>

          <div class="table-wrap">
            <table class="data-table">
              <thead>
                <tr>
                  <th>STT</th>
                  <th>Khách hàng</th>
                  <th>Liên hệ</th>
                  <th>Ngày tham gia</th>
                  <th>Vai trò</th>
                </tr>
              </thead>
              <tbody id="users-tbody"></tbody>
            </table>
          </div>
          <div id="users-pagination"></div>
        </section>
      </main>
    </div>
  </div>

  <div id="app-auth"></div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/common.js"></script>
  <script src="js/admin-users.js"></script>
</body>
</html>
