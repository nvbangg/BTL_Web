<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gio hang - Fashon Shop</title>
    <link rel="stylesheet" href="./css/app.css" />
  </head>
  <body data-base-path="./">
    <div class="page-wrap">
      <header class="public-header">
        <a class="brand" href="./index.html">
          <img src="./assets/logo.svg" alt="logo" />
          <span>Fashon Shop</span>
        </a>

        <div></div>

        <div class="account-wrap">
          <button id="account-trigger" class="account-trigger">Dang nhap</button>
          <div id="account-menu" class="account-menu hidden"></div>
        </div>
      </header>

      <main>
        <h1 class="section-title" style="font-size: 34px">Gio hang cua ban</h1>
        <div class="cart-layout">
          <section>
            <div class="section-card" style="margin-bottom: 10px">
              <label><input id="check-all-items" type="checkbox" /> Chon tat ca</label>
            </div>
            <div id="cart-list" class="cart-list"></div>
          </section>

          <aside class="checkout-panel">
            <h3>Chi tiet don hang</h3>
            <form id="shipping-form" class="auth-form">
              <input name="shippingName" type="text" placeholder="Ten nguoi nhan" required />
              <input name="shippingPhone" type="text" placeholder="So dien thoai" required />
              <textarea name="shippingAddress" class="form-control" placeholder="Dia chi nhan" rows="3" required></textarea>
              <button id="save-profile-btn" class="btn btn-primary btn-block" type="button">Luu lam mac dinh</button>
            </form>

            <div class="checkout-total">
              <span>Tong</span>
              <span id="checkout-total">0đ</span>
            </div>
            <button id="place-order-btn" class="btn btn-accent btn-block" type="button">Xac nhan dat hang</button>
          </aside>
        </div>
      </main>
    </div>

    <script type="module" src="./js/pages/cart.js"></script>
  </body>
</html>
