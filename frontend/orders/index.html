<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đơn hàng của tôi - Fashon Shop</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="orders.css">
</head>
<body>
  <div id="header"></div>

  <main class="page-body">
    <div class="container">
      <div class="breadcrumb">
        <a href="../">Trang chủ</a>
        <span class="sep">›</span>
        <span class="current">Đơn hàng của tôi</span>
      </div>

      <h2 class="orders-title">Đơn hàng của bạn</h2>

      <!-- Tiêu đề cột -->
      <div class="orders-table-header">
        <span>Mã đơn hàng</span>
        <span>Ngày đặt</span>
        <span>Ngày cập nhật</span>
        <span>Tổng tiền</span>
        <span>Trạng thái</span>
      </div>

      <div id="orders-list"></div>

      <div class="empty-state" id="orders-empty" style="display:none">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14,2 14,8 20,8"/></svg>
        <h3>Chưa có đơn hàng nào</h3>
        <p>Hãy mua sắm và đặt hàng</p>
        <a href="../" class="btn btn-primary">Mua sắm ngay</a>
      </div>
    </div>
  </main>

  <div id="footer"></div>
  <div id="auth"></div>

  <script src="../js/utils.js"></script>
  <script src="../js/api.js"></script>
  <script src="../mock/api-responses.js"></script>
  <script src="../js/components.js"></script>
  <script src="../js/auth.js"></script>
  <script src="orders.js"></script>
</body>
</html>
