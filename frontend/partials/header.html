<header class="header">
  <div class="container">
    <a href="" class="header-logo" id="header-logo-link">
      <svg viewBox="0 0 48 36" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="16" cy="18" r="16" fill="#2563EB"/>
        <circle cx="32" cy="18" r="16" fill="#60A5FA" opacity="0.8"/>
      </svg>
      <span>Fashon Shop</span>
    </a>
    <form class="header-search">
      <svg class="header-search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#64748B" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M16 16l5 5"/></svg>
      <input type="text" placeholder="Tìm kiếm quần áo..." name="keyword">
      <button type="submit" class="header-search-btn">Tìm kiếm</button>
    </form>
    <div class="header-actions">
      <div class="header-login-area">
        <button class="btn-login">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          Đăng nhập
        </button>
      </div>
      <div class="header-user-area" style="display:none">
        <div class="header-user">
          <div class="header-user-avatar" aria-hidden="true">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="8" r="4"></circle>
              <path d="M4 20c1.8-4 13.2-4 16 0"></path>
            </svg>
          </div>
          <span class="header-user-name">User</span>
          <svg width="13" height="13" viewBox="0 0 12 12" fill="none"><path d="M3 5l3 3 3-3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <div class="header-user-dropdown">
          <a href="" class="cart-link" id="header-cart-link">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 002 1.61h9.72a2 2 0 002-1.61L23 6H6"/></svg>
            <span class="menu-label">Giỏ hàng</span>
          </a>
          <a href="" class="orders-link">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M21 16V8a2 2 0 00-1-1.73l-7-4a2 2 0 00-2 0l-7 4A2 2 0 002 8v8a2 2 0 001 1.73l7 4a2 2 0 002 0l7-4A2 2 0 0022 16z"/></svg>
            Đơn hàng
          </a>
          <a href="" class="admin-link" style="display:none">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
            Trang Admin
          </a>
          <div class="dropdown-divider"></div>
          <button class="logout-btn">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16,17 21,12 16,7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
            Đăng xuất
          </button>
        </div>
      </div>
    </div>
  </div>
</header>
